<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const mm = document.getElementById('minimap'), mmCtx = mm.getContext('2d');
let W, H;
function resize(){ if(!cv) return; W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', resize); resize();

/* ================= ЗВУКИ ================= */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let soundEnabled = true;
function initAudio(){
  if(!audioCtx){ try { audioCtx = new AudioCtx(); } catch(e){ soundEnabled = false; } }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function playSound(type){
  if(!soundEnabled || !audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  if(type === 'attack'){
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(150, now + 0.1);
    gain.gain.setValueAtTime(0.06, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    osc.start(now); osc.stop(now + 0.12);
  } else if(type === 'hit'){
    osc.type = 'square';
    osc.frequency.setValueAtTime(180, now); osc.frequency.exponentialRampToValueAtTime(60, now + 0.08);
    gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.start(now); osc.stop(now + 0.1);
  } else if(type === 'hurt'){
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);
    gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    osc.start(now); osc.stop(now + 0.18);
  } else if(type === 'death'){
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.5);
    gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
    osc.start(now); osc.stop(now + 0.55);
  } else if(type === 'levelup'){
    [523, 659, 784].forEach((f, i) => {
      const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
      o.type = 'sine'; o.connect(g); g.connect(audioCtx.destination);
      o.frequency.setValueAtTime(f, now + i*0.08);
      g.gain.setValueAtTime(0.001, now + i*0.08);
      g.gain.exponentialRampToValueAtTime(0.12, now + i*0.08 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now + i*0.08 + 0.2);
      o.start(now + i*0.08); o.stop(now + i*0.08 + 0.25);
    });
    return;
  } else if(type === 'shard'){
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1200, now); osc.frequency.exponentialRampToValueAtTime(1800, now + 0.15);
    gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    osc.start(now); osc.stop(now + 0.18);
  } else if(type === 'ability'){
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(200, now + 0.3);
    gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    osc.start(now); osc.stop(now + 0.35);
  } else if(type === 'buy'){
    [784, 1046].forEach((f, i) => {
      const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
      o.type = 'sine'; o.connect(g); g.connect(audioCtx.destination);
      o.frequency.setValueAtTime(f, now + i*0.1);
      g.gain.setValueAtTime(0.001, now + i*0.1);
      g.gain.exponentialRampToValueAtTime(0.1, now + i*0.1 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now + i*0.1 + 0.25);
      o.start(now + i*0.1); o.stop(now + i*0.1 + 0.3);
    });
    return;
  } else if(type === 'deliver'){
    [659, 880, 1046].forEach((f, i) => {
      const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
      o.type = 'sine'; o.connect(g); g.connect(audioCtx.destination);
      o.frequency.setValueAtTime(f, now + i*0.1);
      g.gain.setValueAtTime(0.001, now + i*0.1);
      g.gain.exponentialRampToValueAtTime(0.12, now + i*0.1 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now + i*0.1 + 0.3);
      o.start(now + i*0.1); o.stop(now + i*0.1 + 0.35);
    });
    return;
  } else if(type === 'boom'){
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
    gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
    osc.start(now); osc.stop(now + 0.45);
  }
}
document.addEventListener('touchstart', initAudio, {once:true});
document.addEventListener('click', initAudio, {once:true});

const WORLD = { w: 3600, h: 3600 };
const BASES = {
  blue: { x: 300, y: 3300, r: 100, hp: 5000, hpMax: 5000, team: 'blue' },
  red:  { x: 3300, y: 300, r: 100, hp: 5000, hpMax: 5000, team: 'red' }
};

// === ДОРОЖКИ: обрезаны так, чтобы не заходить в реку ===
// Река идёт по диагонали (600,600) → (3000,3000), ширина ~320px
// Проверяем: |y - x| / sqrt(2) > 200 (полуширина реки + запас)
const LANES = [
  // Верхняя
  [{x:300,y:3300},{x:300,y:2500},{x:300,y:1700},{x:300,y:900},{x:900,y:300},{x:1600,y:300},{x:2400,y:300},{x:3300,y:300}],
  // Мид
  [{x:300,y:3300},{x:900,y:2700},{x:1300,y:2300},{x:1700,y:2000},{x:2100,y:1700},{x:2500,y:1300},{x:2900,y:900},{x:3300,y:300}],
  // Нижняя
  [{x:300,y:3300},{x:900,y:3300},{x:1700,y:3300},{x:2500,y:3300},{x:3300,y:2700},{x:3300,y:2000},{x:3300,y:1200},{x:3300,y:300}],
  // Лесная верхняя
  [{x:300,y:900},{x:700,y:500},{x:1100,y:400},{x:1500,y:400},{x:1900,y:600},{x:2300,y:800},{x:2700,y:1000},{x:3100,y:1300},{x:3300,y:300}],
  // Лесная нижняя
  [{x:300,y:3300},{x:700,y:2900},{x:1200,y:2600},{x:1700,y:2400},{x:2200,y:2300},{x:2700,y:2400},{x:3100,y:2600},{x:3300,y:2700}]
];
const SIDE_PATHS = [
  [{x:600,y:2200},{x:1000,y:2000},{x:1300,y:1900}],
  [{x:2300,y:1800},{x:2700,y:2000},{x:3000,y:2300}],
  [{x:1500,y:1200},{x:1800,y:1000},{x:2100,y:900}]
];

function lanePoint(lane,t){ let tot=0; const s=[]; for(let i=0;i<lane.length-1;i++){ const d=Math.hypot(lane[i].x-lane[i+1].x,lane[i].y-lane[i+1].y); s.push(d); tot+=d; } let g=t*tot; for(let i=0;i<s.length;i++){ if(g<=s[i]){ const f=s[i]?g/s[i]:0; return {x:lane[i].x+(lane[i+1].x-lane[i].x)*f, y:lane[i].y+(lane[i+1].y-lane[i].y)*f}; } g-=s[i]; } return {...lane[lane.length-1]}; }

// === ЛАГЕРЯ только в лесу (не в реке, не на дорогах) ===
const camps = [
  { x:700,y:1900, r:100, kind:'small' },
  { x:500,y:1200, r:100, kind:'big' },
  { x:2600,y:700, r:100, kind:'small' },
  { x:3100,y:1700,r:100, kind:'big' },
  { x:900,y:2600,r:100, kind:'small' },
  { x:600,y:2500, r:100, kind:'big' },
  { x:2600,y:3200,r:100, kind:'small' },
  { x:3100,y:2400,r:100, kind:'big' },
  { x:1800,y:800, r:100, kind:'small' },
  { x:2200,y:2900,r:100, kind:'big' }
];

const NEUTRAL_ITEMS = [
  { id:'wand',    name:'Жезл силы',    emoji:'🪄', cost:5, desc:'+15 урона',              effects:{atkDamage:15} },
  { id:'shield',  name:'Щит леса',     emoji:'🛡️', cost:5, desc:'+100 HP',                effects:{hpMax:100} },
  { id:'boots',   name:'Сапоги ветра', emoji:'👢', cost:5, desc:'+50 скорости',           effects:{speed:50} },
  { id:'ring',    name:'Кольцо маны',  emoji:'💍', cost:5, desc:'+50 MP, +2 MP/сек',      effects:{mpMax:50, mpRegen:2} },
  { id:'crystal', name:'Орб магии',    emoji:'🔮', cost:5, desc:'-15% КД способностей',   effects:{spellCdMul:0.85} },
  { id:'amulet',  name:'Амулет жизни', emoji:'❤️', cost:5, desc:'+150 HP, +3 HP/сек',     effects:{hpMax:150, hpRegen:3} }
];

const ABIL = {
  Q: { cooldown: 8, mana: 25, dmg: 50, radius: 180 },
  W: { cooldown: 15, mana: 40, heal: 100 },
  E: { cooldown: 11, mana: 25, distance: 240 },
  R: { cooldown: 55, mana: 100, dmg: 220, radius: 280, stun: 1.0 }
};
const ABIL_UNLOCK = { Q:1, W:2, E:4, R:6 };

function mulberry32(a){ return function(){ let t=a+=0x6D2B79F5; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }
function distSeg(px,py,a,b){ const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy; let t=l2?((px-a.x)*dx+(py-a.y)*dy)/l2:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(px-(a.x+t*dx),py-(a.y+t*dy)); }
function inRiver(x,y){ return distSeg(x,y,{x:600,y:600},{x:3000,y:3000}) < 200; }
function onLane(x,y, extra){
  const m = extra || 90;
  for(const l of LANES){ for(let j=0;j<l.length-1;j++){ if(distSeg(x,y,l[j],l[j+1]) < m) return true; } }
  for(const l of SIDE_PATHS){ for(let j=0;j<l.length-1;j++){ if(distSeg(x,y,l[j],l[j+1]) < 60) return true; } }
  return false;
}
// Проверка: точка — в лесу (не на дороге, не в реке, не в лагере)
function isForest(x,y){
  if(inRiver(x,y)) return false;
  if(onLane(x,y, 110)) return false;
  if(camps.some(c=>Math.hypot(x-c.x,y-c.y) < c.r + 20)) return false;
  if(Math.hypot(x-BASES.blue.x, y-BASES.blue.y) < 350) return false;
  if(Math.hypot(x-BASES.red.x, y-BASES.red.y) < 350) return false;
  return true;
}
// Проверка для лагеря: центр лагеря — в лесу
function isCampValid(c){
  if(inRiver(c.x, c.y)) return false;
  if(onLane(c.x, c.y, 130)) return false;
  return true;
}

let peer = null, isHost = false, myId = null, myTeam = null;
let hostConn = null, clientConn = null, remoteState = null, gameStarted = false;

const statusEl = document.getElementById('status');
const host = { gameState: null, trees: [], decorations: [], broadcastTimer: 0 };

function generateDecorations(rng){
  const decos = [];
  // Камни — только в лесу
  for(let i=0;i<60;i++){
    const x = rng()*WORLD.w, y = rng()*WORLD.h;
    if(!isForest(x,y)) continue;
    decos.push({ type:'rock', x, y, r: 10+rng()*16, seed: rng() });
  }
  // Кусты — только в лесу
  for(let i=0;i<80;i++){
    const x = rng()*WORLD.w, y = rng()*WORLD.h;
    if(!isForest(x,y)) continue;
    decos.push({ type:'bush', x, y, r: 14+rng()*8, seed: rng() });
  }
  // Цветы — по всей карте, но не в реке
  for(let i=0;i<150;i++){
    const x = rng()*WORLD.w, y = rng()*WORLD.h;
    if(inRiver(x,y)) continue;
    decos.push({ type:'flower', x, y, r: 2+rng()*2, seed: rng() });
  }
  // Руины — только в лесу
  for(let i=0;i<15;i++){
    const x = rng()*WORLD.w, y = rng()*WORLD.h;
    if(!isForest(x,y)) continue;
    decos.push({ type:'ruin', x, y, r: 16+rng()*8, seed: rng() });
  }
  // Трава — по всей карте, но не в реке
  for(let i=0;i<250;i++){
    const x = rng()*WORLD.w, y = rng()*WORLD.h;
    if(inRiver(x,y)) continue;
    decos.push({ type:'grass', x, y, r: 5+rng()*4, seed: rng() });
  }
  // Грибы — только в лесу
  for(let i=0;i<40;i++){
    const x = rng()*WORLD.w, y = rng()*WORLD.h;
    if(!isForest(x,y)) continue;
    decos.push({ type:'mushroom', x, y, r: 6+rng()*4, seed: rng() });
  }
  // Брёвна — только в лесу
  for(let i=0;i<20;i++){
    const x = rng()*WORLD.w, y = rng()*WORLD.h;
    if(!isForest(x,y)) continue;
    decos.push({ type:'log', x, y, r: 20+rng()*8, seed: rng(), angle: rng()*Math.PI });
  }
  // Кости — только в лесу
  for(let i=0;i<12;i++){
    const x = rng()*WORLD.w, y = rng()*WORLD.h;
    if(!isForest(x,y)) continue;
    decos.push({ type:'bones', x, y, r: 10+rng()*6, seed: rng() });
  }
  // Светящиеся кристаллы — только вокруг валидных лагерей
  for(const c of camps){
    if(!isCampValid(c)) continue;
    for(let i=0;i<3;i++){
      const a = rng()*Math.PI*2, r = c.r + 30 + rng()*40;
      const x = c.x + Math.cos(a)*r, y = c.y + Math.sin(a)*r;
      if(!isForest(x,y)) continue;
      decos.push({ type:'glowCrystal', x, y, r: 6+rng()*4, seed: rng() });
    }
  }
  return decos;
}

function hostInit(){
  const rng = mulberry32(98765);
  host.trees = [];
  let attempts = 0;
  while(host.trees.length < 220 && attempts < 20000){
    attempts++;
    const x = rng()*WORLD.w, y = rng()*WORLD.h;
    if(!isForest(x,y)) continue;
    host.trees.push({ x, y, r: 18+rng()*14, sway: rng()*Math.PI*2, swaySpeed: 0.5+rng()*0.8 });
  }
  host.decorations = generateDecorations(rng);

  const units = [];
  for(let li=0; li<3; li++){
    const lane = LANES[li];
    const b1 = lanePoint(lane, 0.2), b2 = lanePoint(lane, 0.4);
    const r1 = lanePoint(lane, 0.6), r2 = lanePoint(lane, 0.8);
    for(const p of [b1, b2]) units.push({ id:'tb'+li+Math.random().toString(36).slice(2,6), type:'tower', team:'blue', x:p.x, y:p.y, r:28, hp:1000, hpMax:1000, atkRange:300, atkDamage:32, atkCooldown:1.15, atkTimer:0 });
    for(const p of [r1, r2]) units.push({ id:'tr'+li+Math.random().toString(36).slice(2,6), type:'tower', team:'red', x:p.x, y:p.y, r:28, hp:1000, hpMax:1000, atkRange:300, atkDamage:32, atkCooldown:1.15, atkTimer:0 });
  }
  for(const c of camps) hostSpawnCamp(units, c);

  host.gameState = {
    players: {}, units, bullets: [], effects: [],
    bases: {
      blue: { x:BASES.blue.x, y:BASES.blue.y, r:BASES.blue.r, hp:5000, hpMax:5000, team:'blue', id:'base_blue' },
      red:  { x:BASES.red.x, y:BASES.red.y, r:BASES.red.r, hp:5000, hpMax:5000, team:'red', id:'base_red' }
    },
    trees: host.trees, decorations: host.decorations,
    waveTimer: 6, gameOver: false,
    camps: camps.map(c => ({ ...c, respawnTimer: 0 })),
    shardDrops: [], floatTexts: [], couriers: []
  };
}

function hostSpawnCamp(units, c){
  if(!isCampValid(c)) return;
  const spawn = (isBig) => {
    // Спавн только в лесу (проверка точки)
    let x, y, ok = false, tries = 0;
    while(!ok && tries < 20){
      const a = Math.random()*Math.PI*2, r = c.r*0.5;
      x = c.x + Math.cos(a)*r; y = c.y + Math.sin(a)*r;
      if(isForest(x,y)) ok = true;
      tries++;
    }
    if(!ok) return;
    units.push({
      id: 'n'+Math.random().toString(36).slice(2,9),
      type:'neutral', team:'neutral',
      x, y, dir:0, walking:false,
      r: isBig?22:16, hp: isBig?320:150, hpMax: isBig?320:150,
      speed: isBig?90:110, atkRange: isBig?85:75, atkDamage: isBig?26:14, atkCooldown:1.0, atkTimer:0,
      xpReward: isBig?70:25, goldReward: isBig?120:45, shardReward: isBig?2:1,
      big: isBig, campX: c.x, campY: c.y, campR: c.r,
      aggroId: null, aggroTimer: 0, wanderAngle: Math.random()*Math.PI*2, wanderTimer: 0,
      attackAnim: 0, hurtFlash: 0, deathAnim: 0
    });
  };
  if(c.kind === 'small'){ spawn(false); spawn(false); }
  else { spawn(true); spawn(true); spawn(false); }
}

function hostCreatePlayer(id, team){
  const base = team === 'blue' ? BASES.blue : BASES.red;
  return {
    id, team,
    x: base.x + (team==='blue'? 130 : -130),
    y: base.y + (team==='blue'? -130 : 130),
    r: 18, dir: team==='blue' ? -Math.PI/2 : Math.PI/2, walking:false,
    hp: 200, hpMax: 200, mp: 100, mpMax: 100,
    speed: 240, hpRegen: 2.5, mpRegen: 6,
    atkRange: 100, atkDamage: 22, atkCooldown: 0.75, atkTimer: 0,
    level: 1, xp: 0, xpNext: 80, kills: 0, gold: 150,
    shards: 0, inventory: [], spellCdMul: 1,
    dead: false, respawnTimer: 0,
    input: { dx:0, dy:0 }, attackHeld: false,
    attackAnim: 0, hurtFlash: 0, castAnim: 0,
    abil: {
      Q: { cd: 0, level: 1, unlocked: true },
      W: { cd: 0, level: 0, unlocked: false },
      E: { cd: 0, level: 0, unlocked: false },
      R: { cd: 0, level: 0, unlocked: false }
    }
  };
}

function hostTick(dt){
  const gs = host.gameState;
  if(!gs || gs.gameOver) return;
  for(const id in gs.players){
    const p = gs.players[id];
    if(p.attackAnim > 0) p.attackAnim -= dt;
    if(p.hurtFlash > 0) p.hurtFlash -= dt;
    if(p.castAnim > 0) p.castAnim -= dt;
    if(p.dead){
      p.respawnTimer -= dt;
      if(p.respawnTimer <= 0){
        const base = p.team === 'blue' ? gs.bases.blue : gs.bases.red;
        p.dead = false; p.hp = p.hpMax; p.mp = p.mpMax;
        p.x = base.x + (p.team==='blue'?130:-130);
        p.y = base.y + (p.team==='blue'?-130:130);
        p.input.dx = 0; p.input.dy = 0; p.attackHeld = false;
      }
      continue;
    }
    if(Math.abs(p.input.dx)+Math.abs(p.input.dy) > 0.01){
      p.x += p.input.dx * p.speed * dt;
      p.y += p.input.dy * p.speed * dt;
      p.dir = Math.atan2(p.input.dy, p.input.dx);
      p.walking = true;
    } else p.walking = false;
    p.x = Math.max(p.r, Math.min(WORLD.w-p.r, p.x));
    p.y = Math.max(p.r, Math.min(WORLD.h-p.r, p.y));
    p.hp = Math.min(p.hpMax, p.hp + p.hpRegen*dt);
    p.mp = Math.min(p.mpMax, p.mp + p.mpRegen*dt);
    p.atkTimer = Math.max(0, p.atkTimer - dt);
    for(const k of ['Q','W','E','R']) if(p.abil[k].cd > 0) p.abil[k].cd = Math.max(0, p.abil[k].cd - dt);
    if(p.attackHeld) hostTryAttack(p);
  }
  for(const u of gs.units){
    if(u.attackAnim > 0) u.attackAnim -= dt;
    if(u.hurtFlash > 0) u.hurtFlash -= dt;
    if(u.deathAnim > 0) u.deathAnim -= dt;
    hostUpdateUnit(u, dt, gs);
  }
  gs.units = gs.units.filter(u => u.hp > 0);

  // КУРЬЕРЫ
  for(let i=gs.couriers.length-1; i>=0; i--){
    const cr = gs.couriers[i];
    const owner = gs.players[cr.ownerId];
    if(!owner){ gs.couriers.splice(i,1); continue; }
    const dx = owner.x - cr.x, dy = owner.y - cr.y;
    const d = Math.hypot(dx,dy);
    if(d < 40){
      // Доставка
      if(!owner.inventory) owner.inventory = [];
      owner.inventory.push(cr.itemId);
      const item = NEUTRAL_ITEMS.find(x=>x.id === cr.itemId);
      if(item){
        const e = item.effects || {};
        if(e.hpMax){ owner.hpMax += e.hpMax; owner.hp += e.hpMax; }
        if(e.mpMax){ owner.mpMax += e.mpMax; owner.mp += e.mpMax; }
        if(e.speed){ owner.speed += e.speed; }
        if(e.atkDamage){ owner.atkDamage += e.atkDamage; }
        if(e.hpRegen){ owner.hpRegen += e.hpRegen; }
        if(e.mpRegen){ owner.mpRegen += e.mpRegen; }
        if(e.spellCdMul){ owner.spellCdMul = (owner.spellCdMul || 1) * e.spellCdMul; }
      }
      if(owner.id === myId) playSound('deliver');
      gs.floatTexts.push({ x: owner.x, y: owner.y - 40, text: '📦 ' + (item? item.name : 'предмет'), color: '#8cf', t: 2, maxT: 2 });
      gs.couriers.splice(i,1);
      continue;
    }
    const sp = cr.speed || 180;
    cr.x += dx/d * sp * dt;
    cr.y += dy/d * sp * dt;
    cr.dir = Math.atan2(dy, dx);
    cr.walking = true;
  }

  // Дропы осколков
  for(let i=gs.shardDrops.length-1; i>=0; i--){
    const d = gs.shardDrops[i];
    d.t -= dt;
    const target = gs.players[d.toId];
    if(target){
      const dx = target.x - d.x, dy = target.y - d.y;
      const dist = Math.hypot(dx,dy)||1;
      const speed = 400;
      if(dist < 30){
        if(target.id === myId) playSound('shard');
        gs.shardDrops.splice(i,1); continue;
      }
      d.x += dx/dist * speed * dt;
      d.y += dy/dist * speed * dt;
    } else { d.y -= 60*dt; }
    if(d.t <= 0) gs.shardDrops.splice(i,1);
  }

  // Всплывающий текст
  for(let i=gs.floatTexts.length-1; i>=0; i--){
    const f = gs.floatTexts[i];
    f.t -= dt; f.y -= 40*dt;
    if(f.t <= 0) gs.floatTexts.splice(i,1);
  }

  // Респавн лагерей
  for(const c of gs.camps){
    const alive = gs.units.some(u => u.type === 'neutral' && Math.hypot(u.x-c.x, u.y-c.y) < c.r + 60);
    if(!alive){
      if(!c.respawnTimer) c.respawnTimer = 60;
      c.respawnTimer -= dt;
      if(c.respawnTimer <= 0){ hostSpawnCamp(gs.units, c); c.respawnTimer = 0; }
    } else c.respawnTimer = 0;
  }
  // Волны миньонов
  gs.waveTimer -= dt;
  if(gs.waveTimer <= 0){ hostSpawnWave(gs); gs.waveTimer = 22; }

  // Пули
  for(let i=gs.bullets.length-1; i>=0; i--){
    const b = gs.bullets[i];
    b.life -= dt;
    if(b.life <= 0){ gs.bullets.splice(i,1); continue; }
    const tgt = hostFindById(gs, b.targetId);
    if(!tgt || (tgt.hp !== undefined && tgt.hp <= 0) || tgt.dead){ gs.bullets.splice(i,1); continue; }
    const dx = tgt.x - b.x, dy = tgt.y - b.y;
    const d = Math.hypot(dx, dy);
    const step = b.speed * dt;
    if(d - (tgt.r||0) < step){ hostDamage(gs, tgt, b.dmg, b.attackerId); gs.bullets.splice(i,1); continue; }
    b.x += dx/d*step; b.y += dy/d*step;
  }
  for(let i=gs.effects.length-1; i>=0; i--){
    const e = gs.effects[i];
    e.t -= dt;
    e.r = e.maxR * (1 - Math.max(0, e.t)/e.maxT);
    if(e.t <= 0) gs.effects.splice(i,1);
  }
}

function hostFindById(gs, id){
  if(!id) return null;
  if(gs.players[id]) return gs.players[id];
  if(id === 'base_blue') return gs.bases.blue;
  if(id === 'base_red') return gs.bases.red;
  return gs.units.find(u => u.id === id) || null;
}

function hostFindNearestEnemy(gs, from, maxDist, allowNeutral){
  let best = null, bestD = maxDist;
  for(const u of gs.units){
    if(u.hp <= 0 || u.team === from.team) continue;
    if(u.team === 'neutral' && !allowNeutral) continue;
    const d = Math.hypot(u.x-from.x, u.y-from.y) - u.r;
    if(d < bestD){ bestD = d; best = u; }
  }
  for(const id in gs.players){
    const p = gs.players[id];
    if(p.dead || p.team === from.team) continue;
    const d = Math.hypot(p.x-from.x, p.y-from.y) - p.r;
    if(d < bestD){ bestD = d; best = p; }
  }
  for(const b of [gs.bases.blue, gs.bases.red]){
    if(b.team === from.team || b.hp <= 0) continue;
    const d = Math.hypot(b.x-from.x, b.y-from.y) - b.r;
    if(d < bestD){ bestD = d; best = b; }
  }
  return best;
}

function hostDamage(gs, target, dmg, attackerId){
  if(target.hp <= 0 || target.dead) return;
  target.hp -= dmg;
  target.hurtFlash = 0.15;
  if(target.id === 'base_blue'){ if(target.hp <= 0){ target.hp = 0; gs.gameOver = true; hostEndGame('red'); } return; }
  if(target.id === 'base_red'){ if(target.hp <= 0){ target.hp = 0; gs.gameOver = true; hostEndGame('blue'); } return; }
  if(target.type === 'neutral' && attackerId){ target.aggroId = attackerId; target.aggroTimer = 6; }
  if(target.hp <= 0){
    target.hp = 0; target.deathAnim = 0.5;
    if(gs.players[target.id]){
      target.dead = true; target.respawnTimer = 6;
      target.input.dx = 0; target.input.dy = 0; target.attackHeld = false;
      if(target.id === myId) playSound('death');
      const killer = attackerId ? gs.players[attackerId] : null;
      if(killer && killer.id !== target.id){
        killer.kills++; killer.gold += 300;
        if(killer.id === myId) playSound('hit');
        gs.floatTexts.push({ x: target.x, y: target.y - 30, text: '+300💰', color:'#fd0', t: 1.5, maxT: 1.5 });
        gainXPAndLevel(killer, 200);
      }
      return;
    }
    const attacker = attackerId ? gs.players[attackerId] : null;
    if(attacker && target.team !== attacker.team){
      attacker.kills++;
      attacker.gold += target.goldReward || 20;
      if(target.type === 'neutral'){
        const shards = target.shardReward || 1;
        attacker.shards = (attacker.shards || 0) + shards;
        for(let i=0;i<shards;i++){
          gs.shardDrops.push({ x: target.x + (Math.random()-0.5)*20, y: target.y, toId: attacker.id, t: 1.5 });
        }
      }
      gainXPAndLevel(attacker, target.xpReward || 10);
    }
  }
}

function gainXPAndLevel(p, amount){
  p.xp += amount;
  while(p.xp >= p.xpNext){
    p.xp -= p.xpNext; p.level++;
    p.xpNext = 80 + (p.level-1)*80;
    p.hpMax += 30; p.hp = Math.min(p.hpMax, p.hp + 100);
    p.mpMax += 12; p.mp = Math.min(p.mpMax, p.mp + 50);
    p.atkDamage += 2.5;
    if(p.id === myId) playSound('levelup');
    for(const k of ['Q','W','E','R']){
      if(!p.abil[k].unlocked && p.level >= ABIL_UNLOCK[k]){
        p.abil[k].unlocked = true; p.abil[k].level = 1;
        break;
      }
    }
  }
}

function hostTryAttack(p){
  if(p.atkTimer > 0 || p.dead) return;
  const t = hostFindNearestEnemy(host.gameState, p, p.atkRange, true);
  if(!t) return;
  p.atkTimer = p.atkCooldown;
  p.attackAnim = 0.3;
  if(p.id === myId) playSound('attack');
  const tid = t.id || (t === host.gameState.bases.blue ? 'base_blue' : t === host.gameState.bases.red ? 'base_red' : null);
  host.gameState.bullets.push({ x:p.x, y:p.y, targetId: tid, dmg: p.atkDamage, attackerId: p.id, speed: 560, life: 2.5, color: p.team === 'blue' ? '#8cf' : '#f96' });
}

function hostCast(p, key){
  if(p.dead || !p.abil[key].unlocked || p.abil[key].cd > 0) return;
  if(p.mp < ABIL[key].mana) return;
  p.mp -= ABIL[key].mana;
  p.abil[key].cd = ABIL[key].cooldown * (p.spellCdMul || 1);
  p.castAnim = 0.4;
  if(p.id === myId) playSound('ability');
  const gs = host.gameState;
  if(key === 'Q'){
    gs.effects.push({ x:p.x, y:p.y, r:0, maxR:ABIL.Q.radius, t:0.45, maxT:0.45, color:'#8af' });
    for(const u of gs.units){
      if(u.hp <= 0 || u.team === p.team) continue;
      if(Math.hypot(u.x-p.x, u.y-p.y) < ABIL.Q.radius + u.r) hostDamage(gs, u, ABIL.Q.dmg, p.id);
    }
    for(const id in gs.players){
      const pl = gs.players[id];
      if(pl.id === p.id || pl.dead || pl.team === p.team) continue;
      if(Math.hypot(pl.x-p.x, pl.y-p.y) < ABIL.Q.radius + pl.r) hostDamage(gs, pl, ABIL.Q.dmg, p.id);
    }
  } else if(key === 'W'){
    p.hp = Math.min(p.hpMax, p.hp + ABIL.W.heal);
    gs.effects.push({ x:p.x, y:p.y, r:0, maxR:100, t:0.5, maxT:0.5, color:'#6f6' });
  } else if(key === 'E'){
    const dx = p.input.dx, dy = p.input.dy;
    let nx = dx, ny = dy;
    if(Math.hypot(nx,ny) < 0.1){ nx = 0; ny = -1; }
    const len = Math.hypot(nx,ny); nx/=len; ny/=len;
    p.x += nx * ABIL.E.distance;
    p.y += ny * ABIL.E.distance;
    p.x = Math.max(p.r, Math.min(WORLD.w-p.r, p.x));
    p.y = Math.max(p.r, Math.min(WORLD.h-p.r, p.y));
    gs.effects.push({ x:p.x, y:p.y, r:0, maxR:60, t:0.4, maxT:0.4, color:'#fd6' });
  } else if(key === 'R'){
    if(p.id === myId) playSound('boom');
    gs.effects.push({ x:p.x, y:p.y, r:0, maxR:ABIL.R.radius, t:0.7, maxT:0.7, color:'#f8f' });
    for(const u of gs.units){
      if(u.hp <= 0 || u.team === p.team) continue;
      if(Math.hypot(u.x-p.x, u.y-p.y) < ABIL.R.radius + u.r){
        hostDamage(gs, u, ABIL.R.dmg, p.id);
        u.stunTimer = ABIL.R.stun;
      }
    }
    for(const id in gs.players){
      const pl = gs.players[id];
      if(pl.id === p.id || pl.dead || pl.team === p.team) continue;
      if(Math.hypot(pl.x-p.x, pl.y-p.y) < ABIL.R.radius + pl.r){
        hostDamage(gs, pl, ABIL.R.dmg, p.id);
        pl.stunTimer = ABIL.R.stun;
      }
    }
  }
}

function hostEndGame(winner){
  hostBroadcast({ type:'gameover', winner });
  showMsg(winner === 'blue' ? '🏆 Синие победили!' : '🏆 Красные победили!', '#4f4', 0);
}

function hostSpawnWave(gs){
  if(gs.units.filter(u => u.type === 'minion').length > 70) return;
  for(let li=0; li<3; li++){
    for(let i=0;i<3;i++){
      const a = Math.random()*Math.PI*2, b = Math.random()*Math.PI*2;
      gs.units.push({
        id: 'mb'+Math.random().toString(36).slice(2,9),
        type:'minion', team:'blue',
        x: BASES.blue.x + Math.cos(a)*30, y: BASES.blue.y + Math.sin(a)*30,
        dir:0, walking:false, r:14, hp:80, hpMax:80, speed:85,
        atkRange:75, atkDamage:10, atkCooldown:0.95, atkTimer:0,
        laneIdx: li, waypointIdx: 0, attackAnim: 0, hurtFlash: 0
      });
      gs.units.push({
        id: 'mr'+Math.random().toString(36).slice(2,9),
        type:'minion', team:'red',
        x: BASES.red.x + Math.cos(b)*30, y: BASES.red.y + Math.sin(b)*30,
        dir:Math.PI, walking:false, r:14, hp:80, hpMax:80, speed:85,
        atkRange:75, atkDamage:10, atkCooldown:0.95, atkTimer:0,
        laneIdx: li, waypointIdx: LANES[li].length-1, attackAnim: 0, hurtFlash: 0
      });
    }
  }
}

function hostUpdateUnit(u, dt, gs){
  if(u.hp <= 0) return;
  if(u.stunTimer > 0){ u.stunTimer -= dt; return; }
  u.atkTimer = Math.max(0, u.atkTimer - dt);
  u.walking = false;
  if(u.type === 'tower'){
    let target = null, bestD = Infinity;
    let minionTarget = null, minionD = Infinity;
    for(const x of gs.units){
      if(x.hp <= 0 || x.team === u.team || x.team === 'neutral') continue;
      const d = Math.hypot(x.x-u.x, x.y-u.y) - x.r;
      if(d > u.atkRange) continue;
      if(x.type === 'minion'){ if(d < minionD){ minionD = d; minionTarget = x; } }
    }
    if(minionTarget){ target = minionTarget; }
    else {
      for(const id in gs.players){
        const p = gs.players[id];
        if(p.dead || p.team === u.team) continue;
        const d = Math.hypot(p.x-u.x, p.y-u.y) - p.r;
        if(d <= u.atkRange && d < bestD){ bestD = d; target = p; }
      }
    }
    if(target){
      u.dir = Math.atan2(target.y-u.y, target.x-u.x);
      if(u.atkTimer <= 0){
        u.atkTimer = u.atkCooldown;
        const tid = target.id || (target === gs.bases.blue ? 'base_blue' : target === gs.bases.red ? 'base_red' : null);
        gs.bullets.push({ x:u.x, y:u.y, targetId:tid, dmg:u.atkDamage, attackerId:null, speed:520, life:2.5, color: u.team==='blue'?'#6cf':'#f96' });
      }
    }
    return;
  }
  if(u.type === 'minion'){
    const t = hostFindNearestEnemy(gs, u, 260, false);
    if(t){
      const d = Math.hypot(t.x-u.x, t.y-u.y) - (t.r||0);
      if(d <= u.atkRange){
        u.dir = Math.atan2(t.y-u.y, t.x-u.x);
        if(u.atkTimer <= 0){
          u.atkTimer = u.atkCooldown; u.attackAnim = 0.25;
          const tid = t.id || (t === gs.bases.blue ? 'base_blue' : t === gs.bases.red ? 'base_red' : null);
          gs.bullets.push({ x:u.x, y:u.y, targetId:tid, dmg:u.atkDamage, attackerId:null, speed:520, life:2.5, color: u.team==='blue'?'#6cf':'#f96' });
        }
      } else {
        const dx = t.x-u.x, dy = t.y-u.y, dd = Math.hypot(dx,dy)||1;
        u.x += dx/dd*u.speed*dt; u.y += dy/dd*u.speed*dt;
        u.dir = Math.atan2(dy,dx); u.walking = true;
      }
      return;
    }
    const lane = LANES[u.laneIdx];
    const dir = u.team === 'blue' ? 1 : -1;
    let wpIdx = u.waypointIdx + dir;
    if(wpIdx < 0 || wpIdx >= lane.length){
      const eb = u.team === 'blue' ? gs.bases.red : gs.bases.blue;
      const d = Math.hypot(eb.x-u.x, eb.y-u.y) - eb.r;
      if(d <= u.atkRange){
        u.dir = Math.atan2(eb.y-u.y, eb.x-u.x);
        if(u.atkTimer <= 0){
          u.atkTimer = u.atkCooldown; u.attackAnim = 0.25;
          gs.bullets.push({ x:u.x, y:u.y, targetId: u.team==='blue'?'base_red':'base_blue', dmg:u.atkDamage, attackerId:null, speed:520, life:2.5, color: u.team==='blue'?'#6cf':'#f96' });
        }
      } else {
        const dx = eb.x-u.x, dy = eb.y-u.y, dd = Math.hypot(dx,dy)||1;
        u.x += dx/dd*u.speed*dt; u.y += dy/dd*u.speed*dt;
        u.dir = Math.atan2(dy,dx); u.walking = true;
      }
      return;
    }
    const wp = lane[wpIdx];
    if(Math.hypot(wp.x-u.x, wp.y-u.y) < 30) u.waypointIdx = wpIdx;
    else {
      const dx = wp.x-u.x, dy = wp.y-u.y, dd = Math.hypot(dx,dy)||1;
      u.x += dx/dd*u.speed*dt; u.y += dy/dd*u.speed*dt;
      u.dir = Math.atan2(dy,dx); u.walking = true;
    }
    return;
  }
  if(u.type === 'neutral'){
    if(u.aggroTimer > 0 && u.aggroId){
      u.aggroTimer -= dt;
      const tgt = gs.players[u.aggroId];
      if(!tgt || tgt.dead){ u.aggroId = null; u.aggroTimer = 0; }
      else {
        const d = Math.hypot(tgt.x-u.x, tgt.y-u.y) - tgt.r;
        u.dir = Math.atan2(tgt.y-u.y, tgt.x-u.x);
        if(d <= u.atkRange){
          if(u.atkTimer <= 0){ u.atkTimer = u.atkCooldown; u.attackAnim = 0.3; hostDamage(gs, tgt, u.atkDamage, null); }
        } else {
          const dx = tgt.x-u.x, dy = tgt.y-u.y, dd = Math.hypot(dx,dy)||1;
          u.x += dx/dd*u.speed*dt; u.y += dy/dd*u.speed*dt; u.walking = true;
        }
        if(Math.hypot(u.x-u.campX, u.y-u.campY) > 500){ u.aggroId = null; u.aggroTimer = 0; }
        return;
      }
    }
    const dHome = Math.hypot(u.x-u.campX, u.y-u.campY);
    if(dHome > 20){
      const dx = u.campX-u.x, dy = u.campY-u.y, dd = Math.hypot(dx,dy)||1;
      // Возврат домой только в лес
      const nx = u.x + dx/dd*u.speed*dt;
      const ny = u.y + dy/dd*u.speed*dt;
      if(isForest(nx, ny) || dHome < 60){ u.x = nx; u.y = ny; u.dir = Math.atan2(dy,dx); u.walking = true; }
      return;
    }
    u.wanderTimer -= dt;
    if(u.wanderTimer <= 0){ u.wanderTimer = 1.5+Math.random()*2; u.wanderAngle = Math.random()*Math.PI*2; }
    const nx = u.x + Math.cos(u.wanderAngle)*u.speed*0.3*dt;
    const ny = u.y + Math.sin(u.wanderAngle)*u.speed*0.3*dt;
    if(Math.hypot(nx-u.campX, ny-u.campY) < u.campR && isForest(nx, ny)){
      u.x = nx; u.y = ny; u.dir = u.wanderAngle; u.walking = true;
    }
  }
}

function hostBroadcast(data){
  if(clientConn && clientConn.open){ try { clientConn.send(JSON.stringify(data)); } catch(e){} }
}

function hostBroadcastState(){
  const gs = host.gameState;
  if(!gs) return;
  const state = {
    type: 'state',
    players: Object.values(gs.players).map(p => ({
      id: p.id, team: p.team, x: p.x, y: p.y, r: p.r, dir: p.dir, walking: p.walking,
      hp: p.hp, hpMax: p.hpMax, mp: p.mp, mpMax: p.mpMax,
      level: p.level, xp: p.xp, xpNext: p.xpNext, kills: p.kills, gold: p.gold,
      shards: p.shards || 0, inventory: p.inventory || [],
      dead: p.dead, respawnTimer: p.respawnTimer,
      attackAnim: p.attackAnim, hurtFlash: p.hurtFlash, castAnim: p.castAnim,
      abil: { Q:{cd:p.abil.Q.cd, level:p.abil.Q.level, unlocked:p.abil.Q.unlocked},
              W:{cd:p.abil.W.cd, level:p.abil.W.level, unlocked:p.abil.W.unlocked},
              E:{cd:p.abil.E.cd, level:p.abil.E.level, unlocked:p.abil.E.unlocked},
              R:{cd:p.abil.R.cd, level:p.abil.R.level, unlocked:p.abil.R.unlocked} }
    })),
    units: gs.units.map(u => ({ id: u.id, type: u.type, team: u.team, x: u.x, y: u.y, r: u.r, dir: u.dir, walking: u.walking, hp: u.hp, hpMax: u.hpMax, big: !!u.big, attackAnim: u.attackAnim||0, hurtFlash: u.hurtFlash||0, deathAnim: u.deathAnim||0 })),
    bullets: gs.bullets.map(b => ({ x: b.x, y: b.y, color: b.color })),
    effects: gs.effects.map(e => ({ x: e.x, y: e.y, r: e.r, color: e.color, t: e.t, maxT: e.maxT })),
    shardDrops: gs.shardDrops.map(d => ({ x: d.x, y: d.y, t: d.t })),
    floatTexts: gs.floatTexts.map(f => ({ x: f.x, y: f.y, text: f.text, color: f.color, t: f.t, maxT: f.maxT })),
    couriers: gs.couriers.map(c => ({ x: c.x, y: c.y, dir: c.dir, ownerId: c.ownerId, walking: c.walking })),
    bases: {
      blue: { x: gs.bases.blue.x, y: gs.bases.blue.y, r: gs.bases.blue.r, hp: gs.bases.blue.hp, hpMax: gs.bases.blue.hpMax, team:'blue' },
      red:  { x: gs.bases.red.x, y: gs.bases.red.y, r: gs.bases.red.r, hp: gs.bases.red.hp, hpMax: gs.bases.red.hpMax, team:'red' }
    },
    trees: gs.trees,
    decorations: gs.decorations
  };
  hostBroadcast(state);
}

function buyItem(itemId){
  if(isHost){ hostBuyItem(myId, itemId); }
  else if(hostConn && hostConn.open){ hostConn.send(JSON.stringify({ type:'buy', itemId })); }
  playSound('buy');
}
function hostBuyItem(playerId, itemId){
  const p = host.gameState.players[playerId];
  if(!p) return;
  const item = NEUTRAL_ITEMS.find(i => i.id === itemId);
  if(!item) return;
  if((p.shards || 0) < item.cost) return;
  if(!p.inventory) p.inventory = [];
  if(p.inventory.includes(itemId)) return;
  p.shards -= item.cost;
  // Не даём предмет сразу — отправляем курьера
  const base = p.team === 'blue' ? host.gameState.bases.blue : host.gameState.bases.red;
  host.gameState.couriers.push({
    x: base.x + (Math.random()-0.5)*80,
    y: base.y + (Math.random()-0.5)*80,
    dir: 0, walking: true, speed: 180,
    ownerId: p.id, itemId: itemId
  });
  host.gameState.floatTexts.push({ x: p.x, y: p.y - 40, text: '🛒 Курьер с ' + item.name, color: '#fd0', t: 2, maxT: 2 });
}
function renderShop(){
  let me = null;
  if(isHost && host.gameState) me = host.gameState.players[myId];
  else if(remoteState) me = remoteState.players.find(x => x.id === myId);
  if(!me) return;
  document.getElementById('shardsShopTxt').textContent = me.shards || 0;
  const list = document.getElementById('shopList');
  list.innerHTML = '';
  const inv = me.inventory || [];
  for(const item of NEUTRAL_ITEMS){
    const has = inv.includes(item.id);
    const canBuy = (me.shards || 0) >= item.cost && !has;
    const el = document.createElement('div');
    el.style.cssText = 'background:' + (canBuy ? 'linear-gradient(135deg,#2a4a2a,#1a3a1a)' : (has ? 'linear-gradient(135deg,#3a3a2a,#1a1a0a)' : 'rgba(60,60,60,0.5)')) + '; border:2px solid ' + (canBuy ? '#6f6' : (has ? '#fd0' : '#666')) + '; border-radius:10px; padding:10px; cursor:pointer;' + (canBuy ? '' : ' opacity:0.6;');
    el.innerHTML = '<div style="font-size:26px; text-align:center;">' + item.emoji + (has ? ' ✅' : '') + '</div>' +
                   '<div style="font-weight:bold; font-size:12px; text-align:center; margin-top:4px;">' + item.name + '</div>' +
                   '<div style="font-size:10px; color:#ccc; text-align:center; margin-top:2px;">' + item.desc + '</div>' +
                   '<div style="text-align:center; margin-top:6px; color:#fd0; font-weight:bold; font-size:12px;">💎 ' + item.cost + '</div>';
    if(canBuy){ el.onclick = () => { buyItem(item.id); setTimeout(renderShop, 100); }; }
    list.appendChild(el);
  }
}

    startGame();

function hostConnsAdd(conn){
  const handleOpen = () => {
    if(!host.gameState.players[conn.peer]) host.gameState.players[conn.peer] = hostCreatePlayer(conn.peer, 'red');
    conn.send(JSON.stringify({ type:'welcome', yourId: conn.peer, team:'red' }));
    showMsg('🔗 Игрок подключился!', '#4f4', 2000);
  };
  if(conn.open) handleOpen();
  else conn.on('open', handleOpen);
  conn.on('data', data => {
    try {
      const msg = JSON.parse(data);
      const p = host.gameState.players[conn.peer];
      if(!p) return;
      if(msg.type === 'input'){ p.input.dx = msg.dx; p.input.dy = msg.dy; }
      else if(msg.type === 'attack'){ p.attackHeld = !!msg.held; }
      else if(msg.type === 'cast'){ hostCast(p, msg.key); }
      else if(msg.type === 'buy'){ hostBuyItem(conn.peer, msg.itemId); }
    } catch(e){}
  });
  conn.on('close', () => {
    if(host.gameState && host.gameState.players[conn.peer]) delete host.gameState.players[conn.peer];
    clientConn = null;
  });
}

  document.getElementById('btnCreate').style.display = 'none';

  document.getElementById('joinBox').style.display = 'flex';

};

document.getElementById('btnJoin').onclick = () => {
  const hostId = document.getElementById('hostIdInput').value.trim();
  if(!hostId){ statusEl.textContent = 'Пустое поле!'; return; }
  isHost = false;
  statusEl.textContent = 'Подключение...';
  peer = new Peer(null, { debug: 1 });
  peer.on('open', id => {
    const conn = peer.connect(hostId, { reliable: true });
    hostConn = conn;
    conn.on('open', () => { statusEl.textContent = 'Подключено!'; });
    conn.on('data', data => {
      try {
        const msg = JSON.parse(data);
        if(msg.type === 'welcome'){
          myId = msg.yourId; myTeam = msg.team;
          if(!gameStarted) startGame();
          statusEl.textContent = 'Игра началась!';
        } else if(msg.type === 'state'){
          remoteState = msg;
          if(!gameStarted) startGame();
        } else if(msg.type === 'gameover'){
          showMsg(msg.winner === myTeam ? '🏆 Победа!' : '💀 Поражение', msg.winner === myTeam ? '#4f4' : '#f44', 0);
        }
      } catch(e){}
    });
    conn.on('error', () => { statusEl.textContent = 'Ошибка соединения'; });
    conn.on('close', () => { showMsg('Соединение потеряно', '#f44', 3000); });
  });
  peer.on('error', err => {
    if(err.type === 'peer-unavailable'){ statusEl.textContent = 'Неверный ID'; }
    else { statusEl.textContent = 'Ошибка: ' + err.type; }
  });
};

  document.getElementById('game').style.display = 'block';

  requestAnimationFrame(mainLoop);
}

const input = { dx:0, dy:0 };
const joyBase = document.getElementById('joyBase'), joyKnob = document.getElementById('joyKnob');
let joyId = null;
function setJoy(t){
  const r = joyBase.getBoundingClientRect();
  const cx = r.left+r.width/2, cy = r.top+r.height/2;
  let dx = t.clientX-cx, dy = t.clientY-cy;
  const max = r.width/2-18, len = Math.hypot(dx,dy);
  if(len>max){ dx=dx/len*max; dy=dy/len*max; }
  joyKnob.style.left = (r.width/2-30+dx)+'px';
  joyKnob.style.top  = (r.height/2-30+dy)+'px';
  input.dx = dx/max; input.dy = dy/max;
}
function resetJoy(){ joyKnob.style.left='40px'; joyKnob.style.top='40px'; input.dx=0; input.dy=0; }
joyBase.addEventListener('touchstart', e=>{ e.preventDefault(); const t=e.changedTouches[0]; joyId=t.identifier; setJoy(t); }, {passive:false});
joyBase.addEventListener('touchmove', e=>{ e.preventDefault(); for(const t of e.changedTouches) if(t.identifier===joyId) setJoy(t); }, {passive:false});
joyBase.addEventListener('touchend', e=>{ for(const t of e.changedTouches) if(t.identifier===joyId){ joyId=null; resetJoy(); } }, {passive:false});
joyBase.addEventListener('touchcancel', ()=>{ joyId=null; resetJoy(); });

let attackHeld = false;
const btnAtk = document.getElementById('btnAttack');
btnAtk.addEventListener('touchstart', e=>{ e.preventDefault(); attackHeld=true; sendAttack(true); }, {passive:false});
btnAtk.addEventListener('touchend', e=>{ e.preventDefault(); attackHeld=false; sendAttack(false); }, {passive:false});
['Q','W','E','R'].forEach(k=>{
  const el = document.getElementById('btn'+k);
  el.addEventListener('touchstart', e=>{ e.preventDefault(); sendCast(k); }, {passive:false});
});

function sendInput(){
  if(isHost){ const p = host.gameState && host.gameState.players[myId]; if(p){ p.input.dx = input.dx; p.input.dy = input.dy; } }
  else if(hostConn && hostConn.open){ hostConn.send(JSON.stringify({ type:'input', dx: input.dx, dy: input.dy })); }
}
function sendAttack(held){
  if(isHost){ const p = host.gameState && host.gameState.players[myId]; if(p) p.attackHeld = held; }
  else if(hostConn && hostConn.open){ hostConn.send(JSON.stringify({ type:'attack', held })); }
}
function sendCast(key){
  if(isHost){ const p = host.gameState && host.gameState.players[myId]; if(p) hostCast(p, key); }
  else if(hostConn && hostConn.open){ hostConn.send(JSON.stringify({ type:'cast', key })); }
}

/* ============ ОТРИСОВКА ПЕРСОНАЖЕЙ ============ */
function drawCharacter(sx, sy, u, style){
  ctx.save(); ctx.translate(sx, sy);
  const r = u.r;
  const t = performance.now()*0.001;

  if(u.deathAnim > 0){
    const k = 1 - u.deathAnim/0.5;
    ctx.globalAlpha = 1 - k;
    ctx.rotate(k * Math.PI * 0.5);
    ctx.scale(1 + k*0.3, 1 - k*0.3);
  }
  const walkPhase = u.walking ? (performance.now()*0.014 + (u.x + u.y)*0.05) : 0;
  const legSwing = Math.sin(walkPhase) * r * 0.45;
  const bobY = u.walking ? Math.abs(Math.sin(walkPhase))*2.5 : Math.sin(t*1.5 + u.x*0.01)*0.5;
  const armSwing = Math.sin(walkPhase + Math.PI) * r * 0.28;
  const atkAnim = u.attackAnim > 0 ? Math.sin((1 - u.attackAnim/0.3) * Math.PI) : 0;

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(0, r*0.95, r*0.9, r*0.32, 0, 0, Math.PI*2); ctx.fill();
  ctx.translate(0, -bobY);

  if(u.hurtFlash > 0){
    ctx.save();
    ctx.globalAlpha = u.hurtFlash * 4;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, 0, r*1.8, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  if(style.isHero){
    ctx.fillStyle = style.cape;
    ctx.beginPath();
    ctx.moveTo(-r*0.9, -r*0.3);
    ctx.quadraticCurveTo(-r*1.4, r*0.3, -r*1.1, r*0.9);
    ctx.lineTo(r*1.1, r*0.9);
    ctx.quadraticCurveTo(r*1.4, r*0.3, r*0.9, -r*0.3);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, -r*0.3); ctx.lineTo(0, r*0.9); ctx.stroke();
  }

  ctx.strokeStyle = style.legs; ctx.lineWidth = r*0.32; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-r*0.3, r*0.35); ctx.lineTo(-r*0.3 - legSwing*0.2, r*0.95); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(r*0.3, r*0.35); ctx.lineTo(r*0.3 + legSwing*0.2, r*0.95); ctx.stroke();
  if(style.boots){
    ctx.fillStyle = style.boots;
    ctx.beginPath(); ctx.ellipse(-r*0.3 - legSwing*0.2, r*0.98, r*0.22, r*0.14, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r*0.3 + legSwing*0.2, r*0.98, r*0.22, r*0.14, 0, 0, Math.PI*2); ctx.fill();
  }

  const bodyGrad = ctx.createLinearGradient(0, -r, 0, r);
  bodyGrad.addColorStop(0, style.bodyLight);
  bodyGrad.addColorStop(1, style.body);
  ctx.fillStyle = bodyGrad;
  ctx.beginPath(); ctx.ellipse(0, 0, r*0.78, r*0.88, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, 0, r*0.78, r*0.88, 0, 0, Math.PI*2); ctx.stroke();

  if(style.isHero){
    ctx.fillStyle = style.bodyLight;
    ctx.beginPath();
    ctx.moveTo(-r*0.5, -r*0.3); ctx.lineTo(0, -r*0.5); ctx.lineTo(r*0.5, -r*0.3);
    ctx.lineTo(r*0.4, r*0.05); ctx.lineTo(-r*0.4, r*0.05);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = style.emblem || '#fd0';
    ctx.beginPath(); ctx.arc(0, -r*0.25, r*0.14, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
    ctx.strokeStyle = '#4a2a0a'; ctx.lineWidth = r*0.14;
    ctx.beginPath(); ctx.moveTo(-r*0.75, r*0.2); ctx.lineTo(r*0.75, r*0.2); ctx.stroke();
    ctx.strokeStyle = '#c8a020'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, r*0.2, r*0.1, 0, Math.PI*2); ctx.stroke();
  }

  ctx.strokeStyle = style.head; ctx.lineWidth = r*0.24; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-r*0.72, -r*0.1); ctx.lineTo(-r*0.88 - armSwing*0.1, r*0.4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(r*0.72, -r*0.1); ctx.lineTo(r*0.88 + armSwing*0.1 + atkAnim*r*0.3, r*0.4 - atkAnim*r*0.4); ctx.stroke();

  if(style.isHero){
    ctx.fillStyle = style.bodyLight;
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(-r*0.72, -r*0.15, r*0.22, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(r*0.72, -r*0.15, r*0.22, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  }

  if(style.weapon === 'staff'){
    const armAngle = atkAnim * 0.5;
    ctx.save();
    ctx.translate(r*0.85, r*0.3);
    ctx.rotate(-armAngle);
    ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r*0.5, -r*1.8); ctx.stroke();
    ctx.strokeStyle = '#c8a020'; ctx.lineWidth = 2;
    for(let i=0;i<4;i++){
      const y = -r*0.3 - i*r*0.2;
      ctx.beginPath(); ctx.moveTo(r*0.08, y); ctx.lineTo(r*0.42, y); ctx.stroke();
    }
    const pulse = 1 + Math.sin(t*4 + u.x*0.01)*0.15;
    ctx.shadowColor = style.crystalColor || '#8cf';
    ctx.shadowBlur = 15 * pulse;
    ctx.fillStyle = style.crystalColor || '#8cf';
    ctx.beginPath();
    ctx.moveTo(r*0.5, -r*1.9); ctx.lineTo(r*0.7, -r*2.05);
    ctx.lineTo(r*0.5, -r*2.2); ctx.lineTo(r*0.3, -r*2.05);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(r*0.5, -r*2.05, 2, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  } else if(style.weapon === 'axe'){
    const armAngle = atkAnim * 0.7;
    ctx.save();
    ctx.translate(r*0.85, r*0.35);
    ctx.rotate(-armAngle);
    ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r*0.4, -r*1.2); ctx.stroke();
    ctx.fillStyle = '#d8d8e0';
    ctx.beginPath();
    ctx.moveTo(r*0.25, -r*1.25); ctx.lineTo(r*0.75, -r*1.65); ctx.lineTo(r*0.7, -r*0.85);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = 'rgba(120,0,0,0.6)';
    ctx.beginPath(); ctx.arc(r*0.5, -r*1.3, 2, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  } else if(style.weapon === 'club'){
    const armAngle = atkAnim * 0.5;
    ctx.save();
    ctx.translate(r*0.85, r*0.3);
    ctx.rotate(-armAngle);
    ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r*0.45, -r*1.0); ctx.stroke();
    ctx.fillStyle = '#3a2a1a';
    ctx.beginPath(); ctx.arc(r*0.45, -r*1.0, r*0.32, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  } else if(style.weapon === 'claw'){
    ctx.save();
    ctx.rotate(-atkAnim*0.5);
    ctx.strokeStyle = '#eee'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    for(let i=0;i<3;i++){
      ctx.beginPath(); ctx.moveTo(r*0.75 + i*4, r*0.15); ctx.lineTo(r*1.2 + i*4, -r*0.5); ctx.stroke();
    }
    ctx.restore();
  }

  const headGrad = ctx.createRadialGradient(-r*0.1, -r*1.1, 0, 0, -r*0.95, r*0.6);
  headGrad.addColorStop(0, style.headLight || style.head);
  headGrad.addColorStop(1, style.head);
  ctx.fillStyle = headGrad;
  ctx.beginPath(); ctx.arc(0, -r*0.95, r*0.58, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();

  if(style.helmet){
    ctx.fillStyle = style.helmet;
    ctx.beginPath();
    ctx.arc(0, -r*1.1, r*0.62, Math.PI, 0);
    ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.strokeStyle = '#c8a020'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, -r*1.05, r*0.62, Math.PI, 0); ctx.stroke();
    if(style.plume){
      ctx.fillStyle = style.plume;
      ctx.beginPath();
      ctx.moveTo(0, -r*1.7);
      ctx.quadraticCurveTo(r*0.35, -r*1.9, r*0.5, -r*1.4);
      ctx.quadraticCurveTo(r*0.25, -r*1.55, 0, -r*1.5);
      ctx.closePath(); ctx.fill();
    }
    if(style.horns){
      ctx.fillStyle = '#e0d0c0';
      ctx.beginPath();
      ctx.moveTo(-r*0.55, -r*1.2); ctx.lineTo(-r*0.85, -r*1.75); ctx.lineTo(-r*0.35, -r*1.3);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(r*0.55, -r*1.2); ctx.lineTo(r*0.85, -r*1.75); ctx.lineTo(r*0.35, -r*1.3);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
    }
  }

  const ex = Math.cos(u.dir||0) * r*0.13;
  const ey = Math.sin(u.dir||0) * r*0.05;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-r*0.2 + ex, -r*0.95 + ey, r*0.12, 0, Math.PI*2);
  ctx.arc(r*0.2 + ex, -r*0.95 + ey, r*0.12, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = style.isHero ? '#0a4a0a' : (style.team === 'blue' ? '#0a2a4a' : (style.team === 'neutral' ? '#4a2a0a' : '#4a0a0a'));
  ctx.beginPath();
  ctx.arc(-r*0.2 + ex*1.3, -r*0.95 + ey*1.3, r*0.06, 0, Math.PI*2);
  ctx.arc(r*0.2 + ex*1.3, -r*0.95 + ey*1.3, r*0.06, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-r*0.22 + ex*1.3, -r*0.97 + ey*1.3, r*0.02, 0, Math.PI*2);
  ctx.arc(r*0.18 + ex*1.3, -r*0.97 + ey*1.3, r*0.02, 0, Math.PI*2);
  ctx.fill();

  if(style.isMe){
    ctx.strokeStyle = 'rgba(120,255,180,0.7)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, r*1.75, 0, Math.PI*2); ctx.stroke();
    const pulse = 1 + Math.sin(performance.now()*0.004)*0.08;
    ctx.strokeStyle = 'rgba(120,255,180,0.3)';
    ctx.beginPath(); ctx.arc(0, 0, r*1.75*pulse, 0, Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}

function drawCourier(sx, sy, c){
  // Маленькое существо — сундучок на ножках
  const r = 14;
  ctx.save();
  ctx.translate(sx, sy);
  // Тень
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(0, r*0.8, r*0.9, r*0.35, 0, 0, Math.PI*2); ctx.fill();
  // Ножки
  const wp = performance.now()*0.02;
  const sw = Math.sin(wp)*3;
  ctx.strokeStyle = '#4a2a0a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-r*0.3, r*0.3); ctx.lineTo(-r*0.3 + sw, r*0.85); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(r*0.3, r*0.3); ctx.lineTo(r*0.3 - sw, r*0.85); ctx.stroke();
  // Тело-сундучок
  ctx.fillStyle = '#8a5a2a';
  ctx.fillRect(-r*0.7, -r*0.5, r*1.4, r*0.8);
  ctx.strokeStyle = '#3a1a08'; ctx.lineWidth = 2;
  ctx.strokeRect(-r*0.7, -r*0.5, r*1.4, r*0.8);
  // Крышка
  ctx.fillStyle = '#a06a3a';
  ctx.beginPath();
  ctx.moveTo(-r*0.7, -r*0.5);
  ctx.quadraticCurveTo(0, -r*1.2, r*0.7, -r*0.5);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#3a1a08'; ctx.lineWidth = 2; ctx.stroke();
  // Замочек
  ctx.fillStyle = '#fd0';
  ctx.beginPath(); ctx.arc(0, -r*0.2, r*0.15, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
  // Глазки
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-r*0.35, -r*0.7, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(r*0.35, -r*0.7, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-r*0.35, -r*0.7, 1.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(r*0.35, -r*0.7, 1.2, 0, Math.PI*2); ctx.fill();
  // Свечение вокруг
  ctx.strokeStyle = 'rgba(255,220,80,0.5)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, r*1.3, 0, Math.PI*2); ctx.stroke();
  ctx.restore();
}

function drawHpBar(u, sx, sy, isMe){
  const w = u.type==='tower'?70:(u.type==='base'?160:44);
  const h = u.type==='base'?12:6;
  const y = sy - u.r - (u.type==='base'?32:24);
  ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(sx-w/2-2, y-2, w+4, h+4);
  ctx.fillStyle = '#200'; ctx.fillRect(sx-w/2, y, w, h);
  const ratio = Math.max(0, u.hp/u.hpMax);
  let color;
  if(u.type==='neutral') color = '#fc4';
  else if(u.team === 'blue') color = isMe ? '#6f6' : '#3fb5ff';
  else color = '#ff4a4a';
  const grd = ctx.createLinearGradient(0, y, 0, y+h);
  grd.addColorStop(0, color);
  grd.addColorStop(1, '#000');
  ctx.fillStyle = grd;
  ctx.fillRect(sx-w/2, y, w * ratio, h);
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.fillRect(sx-w/2, y, w * ratio, 1);

  if(u.type !== 'tower' && u.type !== 'base' && u.type !== 'minion'){
    ctx.fillStyle = isMe ? '#8f8' : (u.team === 'blue' ? '#8cf' : (u.team === 'neutral' ? '#fd8' : '#f88'));
    ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
    ctx.fillText(isMe ? 'ТЫ' : (u.team === 'blue' ? 'СОЮЗНИК' : (u.team === 'neutral' ? 'КРИП' : 'ВРАГ')), sx, y - 4);
  }
}

function drawBase(b, camera){
  const sx = b.x - camera.x, sy = b.y - camera.y;
  if(sx<-250||sy<-250||sx>W+250||sy>H+250) return;
  const isBlue = b.team === 'blue';
  const light = isBlue ? '#6cb8ff' : '#ff8a6c';
  const main  = isBlue ? '#1a5faf' : '#af1a1a';
  const dark  = isBlue ? '#0a2a5a' : '#5a0a0a';
  const halo = ctx.createRadialGradient(sx, sy, b.r*0.5, sx, sy, b.r*1.5);
  halo.addColorStop(0, isBlue ? 'rgba(80,180,255,0.15)' : 'rgba(255,80,80,0.15)');
  halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(sx, sy, b.r*1.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = dark; ctx.beginPath(); ctx.arc(sx, sy, b.r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = light; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(sx, sy, b.r, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = light; ctx.lineWidth = 4;
  for(let i=0;i<12;i++){
    const a = i/12*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(sx + Math.cos(a)*b.r*0.85, sy + Math.sin(a)*b.r*0.85);
    ctx.lineTo(sx + Math.cos(a)*b.r*0.95, sy + Math.sin(a)*b.r*0.95);
    ctx.stroke();
  }
  const midGrad = ctx.createRadialGradient(sx-20, sy-20, 10, sx, sy, b.r*0.7);
  midGrad.addColorStop(0, light); midGrad.addColorStop(1, main);
  ctx.fillStyle = midGrad; ctx.beginPath(); ctx.arc(sx, sy, b.r*0.7, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(sx, sy, b.r*0.55, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = light;
  ctx.beginPath();
  ctx.moveTo(sx-35, sy-15); ctx.lineTo(sx-25, sy-60); ctx.lineTo(sx, sy-75);
  ctx.lineTo(sx+25, sy-60); ctx.lineTo(sx+35, sy-15);
  ctx.lineTo(sx+20, sy+20); ctx.lineTo(sx-20, sy+20);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
  const pulse = 1 + Math.sin(performance.now()*0.003)*0.15;
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 25;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(sx, sy-20, 10*pulse, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  drawHpBar(b, sx, sy, false);
}

function drawTower(u, camera){
  const sx = u.x-camera.x, sy = u.y-camera.y;
  if(sx<-100||sy<-100||sx>W+100||sy>H+100) return;
  const isBlue = u.team === 'blue';
  const light = isBlue ? '#6cb8ff' : '#ff8a6c';
  const main  = isBlue ? '#1a5faf' : '#af1a1a';
  const dark  = isBlue ? '#0a2a5a' : '#5a0a0a';
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.ellipse(sx, sy+u.r*0.9, u.r*1.1, u.r*0.45, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = dark; ctx.beginPath(); ctx.arc(sx, sy, u.r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = light; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(sx, sy, u.r, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1;
  for(let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(sx, sy, u.r*0.4 + i*4, 0, Math.PI*2); ctx.stroke(); }
  ctx.fillStyle = main; ctx.beginPath(); ctx.arc(sx, sy, u.r*0.75, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = light;
  ctx.beginPath(); ctx.moveTo(sx-26, sy-10); ctx.lineTo(sx, sy-50); ctx.lineTo(sx+26, sy-10); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  const glow = 0.6 + Math.sin(performance.now()*0.006 + u.x)*0.4;
  ctx.shadowColor = light; ctx.shadowBlur = 20*glow;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(sx, sy-45, 5, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  drawHpBar(u, sx, sy, false);
}

function drawTree(t, camera){
  const sx = t.x-camera.x, sy = t.y-camera.y;
  if(sx<-60||sy<-60||sx>W+60||sy>H+60) return;
  const swayX = Math.sin(performance.now()*0.001*t.swaySpeed + t.sway) * 2;
  // Мягкая тень без тёмного пятна
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(sx+3, sy+t.r*0.7, t.r*0.7, t.r*0.28, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#2a1a08';
  ctx.beginPath(); ctx.ellipse(sx, sy-t.r*0.1, t.r*0.45, t.r*0.55, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#4a3020';
  ctx.beginPath(); ctx.ellipse(sx-t.r*0.1, sy-t.r*0.15, t.r*0.3, t.r*0.4, 0, 0, Math.PI*2); ctx.fill();
  const layers = [
    { off: 0, size: 1.0, color: '#0d2e0d' },
    { off: -0.2, size: 0.85, color: '#153815' },
    { off: -0.4, size: 0.7, color: '#1d5a1d' },
    { off: -0.55, size: 0.5, color: '#2a7a2a' }
  ];
  for(const l of layers){
    ctx.fillStyle = l.color;
    ctx.beginPath(); ctx.arc(sx + swayX*(1+l.off), sy + t.r*l.off - t.r*0.4, t.r*l.size, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = 'rgba(120,200,120,0.25)';
  ctx.beginPath(); ctx.arc(sx - t.r*0.3 + swayX, sy - t.r*0.85, t.r*0.22, 0, Math.PI*2); ctx.fill();
}

function drawDecoration(d, camera){
  const sx = d.x - camera.x, sy = d.y - camera.y;
  if(sx<-60||sy<-60||sx>W+60||sy>H+60) return;
  const t = performance.now()*0.001;
  if(d.type === 'rock'){
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(sx+2, sy+d.r*0.4, d.r*0.8, d.r*0.28, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#5a5a5a';
    ctx.beginPath(); ctx.arc(sx, sy, d.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#7a7a7a';
    ctx.beginPath(); ctx.arc(sx-d.r*0.25, sy-d.r*0.25, d.r*0.7, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#8a8a8a';
    ctx.beginPath(); ctx.arc(sx-d.r*0.35, sy-d.r*0.35, d.r*0.35, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#3a3a3a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(sx, sy, d.r, 0, Math.PI*2); ctx.stroke();
  } else if(d.type === 'bush'){
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(sx+1, sy+d.r*0.5, d.r*0.9, d.r*0.32, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#0e3a0e';
    ctx.beginPath(); ctx.arc(sx, sy, d.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1a5a1a';
    ctx.beginPath(); ctx.arc(sx-d.r*0.3, sy-d.r*0.2, d.r*0.6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx+d.r*0.3, sy-d.r*0.3, d.r*0.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2a7a2a';
    ctx.beginPath(); ctx.arc(sx, sy-d.r*0.5, d.r*0.4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#d44';
    for(let i=0;i<3;i++){
      const a = d.seed*6 + i*2;
      ctx.beginPath(); ctx.arc(sx + Math.cos(a)*d.r*0.4, sy + Math.sin(a)*d.r*0.3, 1.5, 0, Math.PI*2); ctx.fill();
    }
  } else if(d.type === 'flower'){
    const colors = ['#ff6','#f6f','#6ff','#fff','#f88'];
    ctx.fillStyle = colors[Math.floor(d.seed*colors.length)];
    for(let i=0;i<4;i++){
      const a = i*Math.PI/2 + d.seed*6;
      ctx.beginPath();
      ctx.arc(sx + Math.cos(a)*2, sy + Math.sin(a)*2, 1.5, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.fillStyle = '#ff0';
    ctx.beginPath(); ctx.arc(sx, sy, 1, 0, Math.PI*2); ctx.fill();
  } else if(d.type === 'ruin'){
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(sx, sy+d.r*0.5, d.r*0.8, d.r*0.28, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#8a8070';
    ctx.beginPath(); ctx.ellipse(sx, sy+d.r*0.4, d.r*0.9, d.r*0.3, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#a89a80';
    ctx.beginPath();
    ctx.moveTo(sx - d.r*0.5, sy + d.r*0.4);
    ctx.lineTo(sx - d.r*0.4, sy - d.r*0.8);
    ctx.lineTo(sx + d.r*0.2, sy - d.r*1.2);
    ctx.lineTo(sx + d.r*0.5, sy + d.r*0.4);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#5a5040'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.strokeStyle = 'rgba(60,50,40,0.5)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(sx - d.r*0.3, sy); ctx.lineTo(sx + d.r*0.3, sy - d.r*0.2); ctx.stroke();
  } else if(d.type === 'grass'){
    ctx.strokeStyle = 'rgba(40,90,40,0.8)'; ctx.lineWidth = 1;
    for(let i=0;i<5;i++){
      const a = -Math.PI/2 + (i-2)*0.25;
      ctx.beginPath();
      ctx.moveTo(sx, sy + d.r);
      ctx.lineTo(sx + Math.cos(a)*d.r, sy + d.r - Math.abs(Math.sin(a))*d.r*1.5);
      ctx.stroke();
    }
  } else if(d.type === 'mushroom'){
    ctx.fillStyle = '#e8d8b0';
    ctx.fillRect(sx - d.r*0.15, sy, d.r*0.3, d.r*0.6);
    ctx.fillStyle = d.seed > 0.5 ? '#c84040' : '#d08040';
    ctx.beginPath(); ctx.arc(sx, sy, d.r*0.7, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(sx - d.r*0.25, sy - d.r*0.25, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx + d.r*0.2, sy - d.r*0.1, 1.2, 0, Math.PI*2); ctx.fill();
  } else if(d.type === 'log'){
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(d.angle);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(2, 3, d.r*0.8, d.r*0.35, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#4a3010';
    ctx.beginPath(); ctx.ellipse(0, 0, d.r*0.9, d.r*0.35, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#6a4520';
    ctx.beginPath(); ctx.ellipse(0, -2, d.r*0.9, d.r*0.3, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#3a2008'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-d.r*0.8, -2); ctx.lineTo(d.r*0.8, -2); ctx.stroke();
    ctx.restore();
  } else if(d.type === 'bones'){
    ctx.strokeStyle = '#e0d8c0'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sx - d.r*0.5, sy); ctx.lineTo(sx + d.r*0.5, sy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx - d.r*0.4, sy - d.r*0.2); ctx.lineTo(sx + d.r*0.4, sy + d.r*0.2); ctx.stroke();
    ctx.fillStyle = '#e0d8c0';
    ctx.beginPath(); ctx.arc(sx - d.r*0.5, sy, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx + d.r*0.5, sy, 2, 0, Math.PI*2); ctx.fill();
  } else if(d.type === 'glowCrystal'){
    const pulse = 1 + Math.sin(t*2 + d.seed*10)*0.2;
    ctx.shadowColor = '#c8f'; ctx.shadowBlur = 15*pulse;
    ctx.fillStyle = '#a8e';
    ctx.beginPath();
    ctx.moveTo(sx, sy - d.r*pulse);
    ctx.lineTo(sx + d.r*0.6, sy);
    ctx.lineTo(sx, sy + d.r*pulse);
    ctx.lineTo(sx - d.r*0.6, sy);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
    ctx.shadowBlur = 0;
  }
}

function drawGround(camera, trees, decorations){
  // Базовый фон — БЕЗ радиальных пятен
  ctx.fillStyle = '#1e3a1e'; ctx.fillRect(0,0,W,H);

  // Мелкий шум травы (тонкие штрихи, а не круги)
  ctx.save();
  const rng = mulberry32(3333);
  for(let i=0;i<800;i++){
    const px = rng()*WORLD.w - camera.x;
    const py = rng()*WORLD.h - camera.y;
    if(px<-10||py<-10||px>W+10||py>H+10) continue;
    ctx.strokeStyle = rng() > 0.5 ? 'rgba(35,65,35,0.5)' : 'rgba(20,45,20,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(px + (rng()-0.5)*4, py - 2 - rng()*3);
    ctx.stroke();
  }
  ctx.restore();

  // Дорожки — НЕПРОЗРАЧНЫЕ
  for(const path of SIDE_PATHS){
    ctx.strokeStyle = '#6a5a3a'; ctx.lineWidth = 46; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(path[0].x-camera.x, path[0].y-camera.y);
    for(let i=1;i<path.length;i++) ctx.lineTo(path[i].x-camera.x, path[i].y-camera.y);
    ctx.stroke();
    ctx.strokeStyle = '#8a7a5a'; ctx.lineWidth = 40;
    ctx.beginPath(); ctx.moveTo(path[0].x-camera.x, path[0].y-camera.y);
    for(let i=1;i<path.length;i++) ctx.lineTo(path[i].x-camera.x, path[i].y-camera.y);
    ctx.stroke();
  }
  for(const lane of LANES){
    ctx.strokeStyle = '#5a4a30'; ctx.lineWidth = 96; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(lane[0].x-camera.x, lane[0].y-camera.y);
    for(let i=1;i<lane.length;i++) ctx.lineTo(lane[i].x-camera.x, lane[i].y-camera.y);
    ctx.stroke();
    ctx.strokeStyle = '#8a7a5a'; ctx.lineWidth = 84;
    ctx.beginPath(); ctx.moveTo(lane[0].x-camera.x, lane[0].y-camera.y);
    for(let i=1;i<lane.length;i++) ctx.lineTo(lane[i].x-camera.x, lane[i].y-camera.y);
    ctx.stroke();
    ctx.strokeStyle = '#a89a78'; ctx.lineWidth = 70;
    ctx.beginPath(); ctx.moveTo(lane[0].x-camera.x, lane[0].y-camera.y);
    for(let i=1;i<lane.length;i++) ctx.lineTo(lane[i].x-camera.x, lane[i].y-camera.y);
    ctx.stroke();
    // Разметка пунктиром
    ctx.strokeStyle = 'rgba(220,200,160,0.5)'; ctx.lineWidth = 2;
    ctx.setLineDash([14,16]);
    ctx.beginPath(); ctx.moveTo(lane[0].x-camera.x, lane[0].y-camera.y);
    for(let i=1;i<lane.length;i++) ctx.lineTo(lane[i].x-camera.x, lane[i].y-camera.y);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Река — ПОВЕРХ дорожек (скрывает те, что заходили в воду)
  ctx.save(); ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 340;
  ctx.beginPath(); ctx.moveTo(600-camera.x, 600-camera.y); ctx.lineTo(3000-camera.x, 3000-camera.y); ctx.stroke();
  ctx.strokeStyle = '#0a1a30'; ctx.lineWidth = 320;
  ctx.beginPath(); ctx.moveTo(600-camera.x, 600-camera.y); ctx.lineTo(3000-camera.x, 3000-camera.y); ctx.stroke();
  const rgrad = ctx.createLinearGradient(600-camera.x, 600-camera.y, 3000-camera.x, 3000-camera.y);
  rgrad.addColorStop(0, '#1a3a5a'); rgrad.addColorStop(0.5, '#2a5280'); rgrad.addColorStop(1, '#1a3a5a');
  ctx.strokeStyle = rgrad; ctx.lineWidth = 280;
  ctx.beginPath(); ctx.moveTo(600-camera.x, 600-camera.y); ctx.lineTo(3000-camera.x, 3000-camera.y); ctx.stroke();
  // Анимированные волны
  ctx.strokeStyle = 'rgba(150,200,255,0.35)'; ctx.lineWidth = 3;
  const t = performance.now()*0.001;
  for(let i=0;i<16;i++){
    const tt = (i/16 + (t*0.05) % 1) % 1;
    const bx = 600 + 2400*tt - camera.x;
    const by = 600 + 2400*tt - camera.y;
    if(bx<-200||by<-200||bx>W+200||by>H+200) continue;
    const off = Math.sin(t*2 + i)*20;
    ctx.beginPath();
    ctx.moveTo(bx-50+off, by-15); ctx.quadraticCurveTo(bx+off, by-35, bx+50+off, by-15);
    ctx.stroke();
  }
  ctx.restore();

  // Лагеря
  for(const c of camps){
    if(!isCampValid(c)) continue;
    const sx=c.x-camera.x, sy=c.y-camera.y;
    if(sx<-c.r-60||sy<-c.r-60||sx>W+c.r+60||sy>H+c.r+60) continue;
    const cg = ctx.createRadialGradient(sx, sy, 0, sx, sy, c.r);
    if(c.kind === 'big'){ cg.addColorStop(0, 'rgba(120,70,30,0.3)'); cg.addColorStop(1, 'rgba(90,50,20,0)'); }
    else { cg.addColorStop(0, 'rgba(90,90,40,0.25)'); cg.addColorStop(1, 'rgba(70,80,30,0)'); }
    ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(sx,sy,c.r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = c.kind === 'big' ? 'rgba(200,130,60,0.6)' : 'rgba(180,180,90,0.5)';
    ctx.setLineDash([10,10]); ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(sx,sy,c.r,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
  }

  for(const d of decorations){
    if(d.type === 'grass' || d.type === 'flower' || d.type === 'rock' || d.type === 'mushroom' || d.type === 'bones') drawDecoration(d, camera);
  }
  for(const t of trees) drawTree(t, camera);
}

function renderState(state, myId){
  const me = state.players.find(p => p.id === myId);

  const camera = { x: Math.max(0, Math.min(WORLD.w-W, me.x - W/2)), y: Math.max(0, Math.min(WORLD.h-H, me.y - H/2)) };

  for(const d of (state.decorations || [])) if(d.type === 'log' || d.type === 'ruin') drawDecoration(d, camera);

        : { body:'#a83a3a', bodyLight:'#c85a5a', head:'#f0c090', headLight:'#ffd8a8', legs:'#5a1010', weapon:'axe', helmet:'#c85a5a', team:'red' };
    }
    drawCharacter(sx, sy, u, style);

      const sx = c.x - camera.x, sy = c.y - camera.y;
      if(sx<-100||sy<-100||sx>W+100||sy>H+100) continue;
      drawCourier(sx,
