<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Mini MOBA 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial;touch-action:none;user-select:none}
#cv{display:block;width:100%;height:100%}
#joyBase{position:absolute;left:20px;bottom:20px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3)}
#joyKnob{position:absolute;left:40px;top:40px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.5);border:2px solid #fff}
.btn{position:absolute;border-radius:50%;color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;touch-action:none;text-shadow:1px 1px 3px #000}
#btnAttack{right:20px;bottom:20px;width:96px;height:96px;background:rgba(255,80,80,.85);border:3px solid #fff;font-size:13px}
.skill{position:absolute;right:22px;width:68px;height:68px;border-radius:50%;background:rgba(60,60,90,.9);border:3px solid #fff;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;touch-action:none}
.skill .key{font-size:18px}.skill .lvl{font-size:10px;color:#ffd;margin-top:2px}
.skill .cd{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;font-size:22px}
.skill.locked{opacity:.35}
#btnQ{bottom:130px;background:rgba(80,140,255,.9)}#btnW{bottom:205px;background:rgba(80,220,120,.9)}#btnE{bottom:280px;background:rgba(220,180,60,.9)}#btnR{bottom:355px;background:rgba(200,80,255,.9)}
#ui{position:absolute;top:40px;left:8px;color:#fff;font-size:12px;pointer-events:none;background:rgba(0,0,0,.65);padding:8px 10px;border-radius:10px;min-width:200px;border:1px solid rgba(255,255,255,.2)}
#hpBarOuter{width:190px;height:14px;background:#300;border:2px solid #fff;border-radius:8px;overflow:hidden;margin-top:3px}
#hpBar{height:100%;background:linear-gradient(180deg,#6f6,#0a0);transition:width .15s}
#mpBarOuter{width:190px;height:10px;background:#024;border:2px solid #fff;border-radius:6px;overflow:hidden;margin-top:3px}
#mpBar{height:100%;background:linear-gradient(180deg,#6cf,#08f);transition:width .15s}
#msg{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:22px;font-weight:bold;text-shadow:2px 2px 8px #000;display:none;text-align:center;padding:12px 24px;background:rgba(0,0,0,.8);border-radius:12px;z-index:500}
#minimap{position:absolute;top:8px;right:8px;width:120px;height:120px;background:rgba(0,0,0,.75);border:2px solid #fff;border-radius:6px}
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1a2a40,#000);color:#fff;z-index:200;padding:20px;gap:14px;text-align:center}
#menu h1{font-size:26px;margin-bottom:8px}#menu p{color:#8cf;font-size:13px}
#menu button{padding:14px 32px;font-size:16px;font-weight:bold;border:2px solid #fff;border-radius:12px;background:linear-gradient(135deg,#2a5aa8,#1a3a7a);color:#fff;min-width:230px}
#menu input{padding:12px;font-size:20px;border-radius:8px;border:2px solid #4af;background:rgba(0,0,0,.6);color:#fff;text-align:center;min-width:280px;width:100%;letter-spacing:6px;text-transform:uppercase;font-weight:bold}
#roomInfo{background:rgba(0,0,0,.7);padding:16px;border-radius:12px;border:2px solid #fd0;max-width:90vw}
#roomId{font-size:32px;color:#fd0;font-weight:bold;margin:10px 0;word-break:break-all;user-select:all;letter-spacing:6px}
#status{color:#8cf;font-size:13px;min-height:20px}
#roomBadge{position:absolute;top:8px;left:50%;transform:translateX(-50%);color:#fd0;font-size:16px;background:rgba(0,0,0,.85);padding:8px 16px;border-radius:8px;z-index:999;user-select:all;letter-spacing:4px;text-align:center;border:1px solid #fd0;font-weight:bold}
#respawn{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(120,0,0,.4);color:#fff;font-size:32px;font-weight:bold;text-shadow:2px 2px 8px #000;z-index:400;pointer-events:none;text-align:center}
</style>
</head>

</div>

<div id="msg"></div>
<div id="respawn"></div>
<button id="shopBtn" style="position:absolute;top:8px;left:8px;z-index:60;padding:10px 14px;background:linear-gradient(135deg,#ffd960,#c08020);border:2px solid #fff;border-radius:10px;color:#000;font-weight:bold;font-size:13px;display:none">🛒 Магазин</button>
<div id="shopModal" style="position:absolute;inset:0;background:rgba(0,0,0,.92);display:none;z-index:200;padding:12px;overflow-y:auto;color:#fff">
<div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:2px solid #fd0">
<div style="font-size:16px;font-weight:bold">🛒 Магазин — 💎 <span id="shardsShopTxt">0</span></div>
<button id="shopClose" style="background:#444;color:#fff;border:1px solid #888;padding:6px 14px;border-radius:8px;font-size:16px">✕</button>
</div>

<div id="shopList" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"></div>
</div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const mm=document.getElementById('minimap'),mmCtx=mm.getContext('2d');
let W,H;const ZOOM=0.85;
function resize(){if(!cv)return;W=Math.floor(innerWidth/ZOOM);H=Math.floor(innerHeight/ZOOM);cv.width=W;cv.height=H;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px'}
addEventListener('resize',resize);resize();

let audioCtx=null;
function initAudio(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()}
function playSound(type){
  if(!audioCtx)return;const n=audioCtx.currentTime;
  function osc(t,f,d,v,st){try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.connect(g);g.connect(audioCtx.destination);o.frequency.setValueAtTime(f,st);g.gain.setValueAtTime(.001,st);g.gain.exponentialRampToValueAtTime(v,st+.01);g.gain.exponentialRampToValueAtTime(.001,st+d);o.start(st);o.stop(st+d+.02)}catch(e){}}
  function sweep(t,f1,f2,d,v,st){try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.connect(g);g.connect(audioCtx.destination);o.frequency.setValueAtTime(f1,st);o.frequency.exponentialRampToValueAtTime(f2,st+d);g.gain.setValueAtTime(v,st);g.gain.exponentialRampToValueAtTime(.001,st+d);o.start(st);o.stop(st+d+.02)}catch(e){}}
  if(type==='attack'){sweep('sawtooth',650,180,.13,.05,n);sweep('sine',1000,400,.1,.03,n+.01)}
  else if(type==='hit'){sweep('square',220,60,.08,.09,n);osc('triangle',1500,.04,.06,n)}
  else if(type==='death'){sweep('sawtooth',400,40,.7,.15,n);osc('sine',80,.4,.1,n+.1)}
  else if(type==='levelup'){[523,659,784,1046].forEach((f,i)=>osc('sine',f,.35,.1,n+i*.09))}
  else if(type==='shard'){sweep('sine',1400,2200,.12,.07,n)}
  else if(type==='ability'){sweep('triangle',800,200,.35,.11,n)}
  else if(type==='buy'){osc('sine',784,.25,.1,n);osc('sine',1046,.3,.11,n+.1)}
  else if(type==='deliver'){osc('sine',659,.25,.1,n);osc('sine',880,.25,.1,n+.1);osc('sine',1046,.4,.12,n+.2)}
  else if(type==='boom'){sweep('sawtooth',120,25,.5,.22,n);osc('sine',60,.6,.15,n+.05)}
  else if(type==='tower'){sweep('square',500,200,.2,.08,n)}
  else if(type==='boss'){sweep('sawtooth',80,30,.9,.25,n);sweep('sawtooth',180,60,.7,.18,n+.1);osc('sine',50,.8,.2,n+.2)}
}
document.addEventListener('touchstart',initAudio,{once:true});
document.addEventListener('click',initAudio,{once:true});

const WORLD={w:3600,h:3600};
const BASES={blue:{x:300,y:3300,r:100,hp:5000,hpMax:5000,team:'blue'},red:{x:3300,y:300,r:100,hp:5000,hpMax:5000,team:'red'}};
const LANES=[
  [{x:300,y:3300},{x:300,y:2500},{x:300,y:1700},{x:300,y:900},{x:900,y:300},{x:1600,y:300},{x:2400,y:300},{x:3300,y:300}],
  [{x:300,y:3300},{x:900,y:2700},{x:1300,y:2300},{x:1700,y:2000},{x:2100,y:1700},{x:2500,y:1300},{x:2900,y:900},{x:3300,y:300}],
  [{x:300,y:3300},{x:900,y:3300},{x:1700,y:3300},{x:2500,y:3300},{x:3300,y:2700},{x:3300,y:2000},{x:3300,y:1200},{x:3300,y:300}],
  [{x:300,y:900},{x:700,y:500},{x:1100,y:400},{x:1500,y:400},{x:1900,y:600},{x:2300,y:800},{x:2700,y:1000},{x:3100,y:1300},{x:3300,y:300}],
  [{x:300,y:3300},{x:700,y:2900},{x:1200,y:2600},{x:1700,y:2400},{x:2200,y:2300},{x:2700,y:2400},{x:3100,y:2600},{x:3300,y:2700}]
];
const SIDE_PATHS=[[{x:600,y:2200},{x:1000,y:2000},{x:1300,y:1900}],[{x:2300,y:1800},{x:2700,y:2000},{x:3000,y:2300}],[{x:1500,y:1200},{x:1800,y:1000},{x:2100,y:900}]];

function lanePoint(lane,t){let tot=0;const s=[];for(let i=0;i<lane.length-1;i++){const d=Math.hypot(lane[i].x-lane[i+1].x,lane[i].y-lane[i+1].y);s.push(d);tot+=d}let g=t*tot;for(let i=0;i<s.length;i++){if(g<=s[i]){const f=s[i]?g/s[i]:0;return{x:lane[i].x+(lane[i+1].x-lane[i].x)*f,y:lane[i].y+(lane[i+1].y-lane[i].y)*f}}g-=s[i]}return{...lane[lane.length-1]}}

const camps=[
  {x:900,y:1000,r:100,kind:'small'},{x:400,y:900,r:100,kind:'big'},
  {x:2700,y:900,r:100,kind:'small'},{x:3200,y:1300,r:100,kind:'big'},
  {x:900,y:2600,r:100,kind:'small'},{x:400,y:2500,r:100,kind:'big'},
  {x:2700,y:2700,r:100,kind:'small'},{x:3200,y:2700,r:100,kind:'big'},
  {x:1800,y:700,r:100,kind:'small'},{x:2200,y:2400,r:100,kind:'big'},
  {x:1000,y:1700,r:100,kind:'small'},{x:2600,y:1400,r:100,kind:'big'},
  {x:600,y:1700,r:100,kind:'small'},{x:1400,y:900,r:100,kind:'big'},
  {x:2000,y:1500,r:100,kind:'small'},{x:1400,y:2800,r:100,kind:'big'},
  {x:2200,y:1900,r:100,kind:'small'},{x:2800,y:1900,r:100,kind:'big'},
  {x:800,y:2900,r:100,kind:'small'},{x:2800,y:900,r:100,kind:'big'}
];

// === ТОЧКИ СПАВНА ТЕРЗАТЕЛЯ ===
const terrorSpots=[
  {x:1200,y:1200,r:140,respawnTimer:0},
  {x:2400,y:2400,r:140,respawnTimer:0}
];

const NEUTRAL_ITEMS=[
  {id:'wand',name:'Жезл силы',emoji:'🪄',cost:5,desc:'+15 урона',effects:{atkDamage:15}},
  {id:'shield',name:'Щит леса',emoji:'🛡️',cost:5,desc:'+100 HP',effects:{hpMax:100}},
  {id:'boots',name:'Сапоги ветра',emoji:'👢',cost:5,desc:'+50 скорости',effects:{speed:50}},
  {id:'ring',name:'Кольцо маны',emoji:'💍',cost:5,desc:'+50 MP,+2 MP/с',effects:{mpMax:50,mpRegen:2}},
  {id:'crystal',name:'Орб магии',emoji:'🔮',cost:5,desc:'-15% КД',effects:{spellCdMul:.85}},
  {id:'amulet',name:'Амулет жизни',emoji:'❤️',cost:5,desc:'+150 HP,+3 HP/с',effects:{hpMax:150,hpRegen:3}},
  {id:'sword',name:'Меч воина',emoji:'⚔️',cost:10,desc:'+30 урона',effects:{atkDamage:30}},
  {id:'armor',name:'Броня',emoji:'🦺',cost:10,desc:'+250 HP',effects:{hpMax:250}},
  {id:'swiftboots',name:'Скороходы',emoji:'🥾',cost:8,desc:'+80 скорости',effects:{speed:80}},
  {id:'manastone',name:'Камень маны',emoji:'💠',cost:8,desc:'+100 MP,+4 MP/с',effects:{mpMax:100,mpRegen:4}},
  {id:'mask',name:'Маска силы',emoji:'🎭',cost:12,desc:'+20 урон,+50 HP,+1 HP/с',effects:{atkDamage:20,hpMax:50,hpRegen:1}},
  {id:'crown',name:'Корона',emoji:'👑',cost:20,desc:'+50 урон,+200 HP,+50 скор.',effects:{atkDamage:50,hpMax:200,speed:50}}
];

const ABIL={Q:{cooldown:8,mana:25,dmg:40,radius:180},W:{cooldown:15,mana:40,heal:80},E:{cooldown:11,mana:25,distance:240,damage:40},R:{cooldown:55,mana:100,dmg:176,radius:280,stun:1}};
const ABIL_UNLOCK={Q:1,W:2,E:4,R:6};

function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function distSeg(px,py,a,b){const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy;let t=l2?((px-a.x)*dx+(py-a.y)*dy)/l2:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(a.x+t*dx),py-(a.y+t*dy))}
function inRiver(x,y){return distSeg(x,y,{x:600,y:600},{x:3000,y:3000})<220}
function onLane(x,y,e){const m=e||90;for(const l of LANES)for(let j=0;j<l.length-1;j++)if(distSeg(x,y,l[j],l[j+1])<m)return true;for(const l of SIDE_PATHS)for(let j=0;j<l.length-1;j++)if(distSeg(x,y,l[j],l[j+1])<60)return true;return false}
function isForest(x,y){if(inRiver(x,y))return false;if(onLane(x,y,130))return false;if(camps.some(c=>Math.hypot(x-c.x,y-c.y)<c.r+20))return false;if(terrorSpots.some(t=>Math.hypot(x-t.x,y-t.y)<t.r+20))return false;if(Math.hypot(x-BASES.blue.x,y-BASES.blue.y)<400)return false;if(Math.hypot(x-BASES.red.x,y-BASES.red.y)<400)return false;return true}
function isCampValid(c){if(inRiver(c.x,c.y))return false;if(onLane(c.x,c.y,150))return false;if(Math.hypot(c.x-BASES.blue.x,c.y-BASES.blue.y)<400)return false;if(Math.hypot(c.x-BASES.red.x,c.y-BASES.red.y)<400)return false;return true}

let peer=null,isHost=false,myId=null,myTeam=null,hostConn=null,clientConn=null,remoteState=null,gameStarted=false;
const statusEl=document.getElementById('status');
const host={gameState:null,trees:[],decorations:[],broadcastTimer:0};

function genDecos(rng){
  const d=[];
  for(let i=0;i<50;i++){const x=rng()*WORLD.w,y=rng()*WORLD.h;if(!isForest(x,y))continue;d.push({type:'rock',x,y,r:12+rng()*18,seed:rng()})}
  for(let i=0;i<80;i++){const x=rng()*WORLD.w,y=rng()*WORLD.h;if(!isForest(x,y))continue;d.push({type:'bush',x,y,r:14+rng()*8,seed:rng()})}
  for(let i=0;i<120;i++){const x=rng()*WORLD.w,y=rng()*WORLD.h;if(inRiver(x,y))continue;d.push({type:'flower',x,y,r:2+rng()*2,seed:rng()})}
  for(let i=0;i<12;i++){const x=rng()*WORLD.w,y=rng()*WORLD.h;if(!isForest(x,y))continue;d.push({type:'ruin',x,y,r:16+rng()*8,seed:rng()})}
  for(let i=0;i<200;i++){const x=rng()*WORLD.w,y=rng()*WORLD.h;if(inRiver(x,y))continue;d.push({type:'grass',x,y,r:5+rng()*4,seed:rng()})}
  for(let i=0;i<35;i++){const x=rng()*WORLD.w,y=rng()*WORLD.h;if(!isForest(x,y))continue;d.push({type:'mushroom',x,y,r:6+rng()*4,seed:rng()})}
  for(let i=0;i<18;i++){const x=rng()*WORLD.w,y=rng()*WORLD.h;if(!isForest(x,y))continue;d.push({type:'log',x,y,r:20+rng()*8,seed:rng(),angle:rng()*Math.PI})}
  for(let i=0;i<10;i++){const x=rng()*WORLD.w,y=rng()*WORLD.h;if(!isForest(x,y))continue;d.push({type:'bones',x,y,r:10+rng()*6,seed:rng()})}
  for(const c of camps){if(!isCampValid(c))continue;for(let i=0;i<3;i++){const a=rng()*6.28,r=c.r+30+rng()*40;const x=c.x+Math.cos(a)*r,y=c.y+Math.sin(a)*r;if(!isForest(x,y))continue;d.push({type:'glowCrystal',x,y,r:6+rng()*4,seed:rng()})}}
  return d;
}

function hostInit(){
  const rng=mulberry32(98765);
  host.trees=[];let att=0;
  while(host.trees.length<180&&att<20000){att++;const x=rng()*WORLD.w,y=rng()*WORLD.h;if(!isForest(x,y))continue;host.trees.push({x,y,r:22+rng()*16,sway:rng()*6.28,swaySpeed:.5+rng()*.8,type:rng()<.3?'pine':'oak',seed:rng()})}
  host.decorations=genDecos(rng);
  const units=[];
  for(let li=0;li<3;li++){
    const lane=LANES[li];
    const b1=lanePoint(lane,.2),b2=lanePoint(lane,.4),r1=lanePoint(lane,.6),r2=lanePoint(lane,.8);
    for(const p of [b1,b2])units.push({id:'tb'+li+Math.random().toString(36).slice(2,6),type:'tower',team:'blue',x:p.x,y:p.y,r:28,hp:1000,hpMax:1000,atkRange:320,atkDamage:32,atkCooldown:1.15,atkTimer:0});
    for(const p of [r1,r2])units.push({id:'tr'+li+Math.random().toString(36).slice(2,6),type:'tower',team:'red',x:p.x,y:p.y,r:28,hp:1000,hpMax:1000,atkRange:320,atkDamage:32,atkCooldown:1.15,atkTimer:0});
  }
  for(const c of camps)spawnCamp(units,c);
  for(const t of terrorSpots)spawnTerror(units,t);
  host.gameState={players:{},units,bullets:[],effects:[],bases:{blue:{x:BASES.blue.x,y:BASES.blue.y,r:BASES.blue.r,hp:5000,hpMax:5000,team:'blue',id:'base_blue'},red:{x:BASES.red.x,y:BASES.red.y,r:BASES.red.r,hp:5000,hpMax:5000,team:'red',id:'base_red'}},trees:host.trees,decorations:host.decorations,waveTimer:20,gameOver:false,camps:camps.map(c=>({...c,respawnTimer:0})),terrorSpots:terrorSpots.map(t=>({...t,respawnTimer:0})),shardDrops:[],floatTexts:[],couriers:[]};
  spawnWave(host.gameState);
  spawnWave(host.gameState);
}

function spawnCamp(units,c){
  if(!isCampValid(c))return;
  const spawn=(isBig)=>{
    let x,y,ok=false,tr=0;
    while(!ok&&tr<30){const a=Math.random()*6.28,r=c.r*(0.2+Math.random()*0.5);x=c.x+Math.cos(a)*r;y=c.y+Math.sin(a)*r;if(!inRiver(x,y)&&!onLane(x,y,110))ok=true;tr++}
    if(!ok){x=c.x;y=c.y}
    units.push({id:'n'+Math.random().toString(36).slice(2,9),type:'neutral',team:'neutral',x,y,dir:0,walking:false,r:isBig?24:18,hp:isBig?320:150,hpMax:isBig?320:150,speed:isBig?90:110,atkRange:isBig?85:75,atkDamage:isBig?26:14,atkCooldown:1,atkTimer:0,xpReward:isBig?70:25,shardReward:isBig?2:1,big:isBig,campX:c.x,campY:c.y,campR:c.r,aggroId:null,aggroTimer:0,wanderAngle:Math.random()*6.28,wanderTimer:0,attackAnim:0,hurtFlash:0,deathAnim:0});
  };
  if(c.kind==='small'){spawn(false);spawn(false)}else{spawn(true);spawn(true);spawn(false)}
}

// === СПАВН ТЕРЗАТЕЛЯ ===
function spawnTerror(units,t){
  units.push({id:'terror'+Math.random().toString(36).slice(2,9),type:'terror',team:'neutral',x:t.x,y:t.y,dir:0,walking:false,r:36,hp:2000,hpMax:2000,speed:70,atkRange:120,atkDamage:60,atkCooldown:1.4,atkTimer:0,xpReward:500,shardReward:8,big:true,campX:t.x,campY:t.y,campR:t.r,aggroId:null,aggroTimer:0,wanderAngle:Math.random()*6.28,wanderTimer:0,attackAnim:0,hurtFlash:0,deathAnim:0,terror:true});
}

function createPlayer(id,team){
  const base=team==='blue'?BASES.blue:BASES.red;
  return {id,team,x:base.x+(team==='blue'?150:-150),y:base.y+(team==='blue'?-250:250),r:20,dir:team==='blue'?-Math.PI/2:Math.PI/2,walking:false,hp:200,hpMax:200,mp:100,mpMax:100,speed:240,hpRegen:2.5,mpRegen:6,atkRange:170,atkDamage:22,atkCooldown:.75,atkTimer:0,level:1,xp:0,xpNext:80,kills:0,shards:0,inventory:[],spellCdMul:1,dead:false,respawnTimer:0,input:{dx:0,dy:0},attackHeld:false,attackAnim:0,hurtFlash:0,castAnim:0,abil:{Q:{cd:0,level:1,unlocked:true},W:{cd:0,level:0,unlocked:false},E:{cd:0,level:0,unlocked:false},R:{cd:0,level:0,unlocked:false}}};
}

function hostTick(dt){
  const gs=host.gameState;if(!gs||gs.gameOver)return;
  for(const id in gs.players){
    const p=gs.players[id];
    if(p.attackAnim>0)p.attackAnim-=dt;
    if(p.hurtFlash>0)p.hurtFlash-=dt;
    if(p.castAnim>0)p.castAnim-=dt;
    if(p.dead){p.respawnTimer-=dt;if(p.respawnTimer<=0){const b=p.team==='blue'?gs.bases.blue:gs.bases.red;p.dead=false;p.hp=p.hpMax;p.mp=p.mpMax;p.x=b.x+(p.team==='blue'?150:-150);p.y=b.y+(p.team==='blue'?-250:250);p.input.dx=0;p.input.dy=0;p.attackHeld=false}continue}
    if(Math.abs(p.input.dx)+Math.abs(p.input.dy)>.01){p.x+=p.input.dx*p.speed*dt;p.y+=p.input.dy*p.speed*dt;p.dir=Math.atan2(p.input.dy,p.input.dx);p.walking=true}else p.walking=false;
    p.x=Math.max(p.r,Math.min(WORLD.w-p.r,p.x));p.y=Math.max(p.r,Math.min(WORLD.h-p.r,p.y));
    p.hp=Math.min(p.hpMax,p.hp+p.hpRegen*dt);p.mp=Math.min(p.mpMax,p.mp+p.mpRegen*dt);
    p.atkTimer=Math.max(0,p.atkTimer-dt);
    for(const k of ['Q','W','E','R'])if(p.abil[k].cd>0)p.abil[k].cd=Math.max(0,p.abil[k].cd-dt);
    if(p.attackHeld)tryAttack(p);
  }
  for(const u of gs.units){if(u.attackAnim>0)u.attackAnim-=dt;if(u.hurtFlash>0)u.hurtFlash-=dt;if(u.deathAnim>0)u.deathAnim-=dt;updateUnit(u,dt,gs)}
  gs.units=gs.units.filter(u=>u.hp>0);
  for(let i=gs.couriers.length-1;i>=0;i--){
    const cr=gs.couriers[i],owner=gs.players[cr.ownerId];
    if(!owner){gs.couriers.splice(i,1);continue}
    const dx=owner.x-cr.x,dy=owner.y-cr.y,d=Math.hypot(dx,dy);
    if(d<40){
      if(!owner.inventory)owner.inventory=[];
      owner.inventory.push(cr.itemId);
      const item=NEUTRAL_ITEMS.find(x=>x.id===cr.itemId);
      if(item){const e=item.effects||{};if(e.hpMax){owner.hpMax+=e.hpMax;owner.hp+=e.hpMax}if(e.mpMax){owner.mpMax+=e.mpMax;owner.mp+=e.mpMax}if(e.speed)owner.speed+=e.speed;if(e.atkDamage)owner.atkDamage+=e.atkDamage;if(e.hpRegen)owner.hpRegen+=e.hpRegen;if(e.mpRegen)owner.mpRegen+=e.mpRegen;if(e.spellCdMul)owner.spellCdMul=(owner.spellCdMul||1)*e.spellCdMul}
      if(owner.id===myId)playSound('deliver');
      gs.floatTexts.push({x:owner.x,y:owner.y-40,text:'📦 '+(item?item.name:'предмет'),color:'#8cf',t:2,maxT:2});
      gs.couriers.splice(i,1);continue;
    }
    cr.x+=dx/d*180*dt;cr.y+=dy/d*180*dt;cr.dir=Math.atan2(dy,dx);cr.walking=true;
  }
  for(let i=gs.shardDrops.length-1;i>=0;i--){
    const d=gs.shardDrops[i];d.t-=dt;const target=gs.players[d.toId];
    if(target){const dx=target.x-d.x,dy=target.y-d.y;const dist=Math.hypot(dx,dy)||1;if(dist<30){if(target.id===myId)playSound('shard');gs.shardDrops.splice(i,1);continue}d.x+=dx/dist*400*dt;d.y+=dy/dist*400*dt}else d.y-=60*dt;
    if(d.t<=0)gs.shardDrops.splice(i,1);
  }
  for(let i=gs.floatTexts.length-1;i>=0;i--){const f=gs.floatTexts[i];f.t-=dt;f.y-=40*dt;if(f.t<=0)gs.floatTexts.splice(i,1)}
  for(const c of gs.camps){
    const alive=gs.units.some(u=>u.type==='neutral'&&Math.hypot(u.x-c.x,u.y-c.y)<c.r+60);
    if(!alive){if(!c.respawnTimer)c.respawnTimer=60;c.respawnTimer-=dt;if(c.respawnTimer<=0){spawnCamp(gs.units,c);c.respawnTimer=0}}else c.respawnTimer=0;
  }
  // Респавн Терзателя
  for(const t of gs.terrorSpots){
    const alive=gs.units.some(u=>u.type==='terror'&&Math.hypot(u.x-t.x,u.y-t.y)<t.r+60);
    if(!alive){if(!t.respawnTimer)t.respawnTimer=180;t.respawnTimer-=dt;if(t.respawnTimer<=0){spawnTerror(gs.units,t);t.respawnTimer=0}}else t.respawnTimer=0;
  }
  gs.waveTimer-=dt;if(gs.waveTimer<=0){spawnWave(gs);gs.waveTimer=22}
  for(let i=gs.bullets.length-1;i>=0;i--){
    const b=gs.bullets[i];b.life-=dt;
    if(b.life<=0){gs.bullets.splice(i,1);continue}
    const tgt=findById(gs,b.targetId);
    if(!tgt||(tgt.hp!==undefined&&tgt.hp<=0)||tgt.dead){gs.bullets.splice(i,1);continue}
    const dx=tgt.x-b.x,dy=tgt.y-b.y,d=Math.hypot(dx,dy),step=b.speed*dt;
    if(d-(tgt.r||0)<step){hostDamage(gs,tgt,b.dmg,b.attackerId);gs.bullets.splice(i,1);continue}
    b.x+=dx/d*step;b.y+=dy/d*step;
  }
  for(let i=gs.effects.length-1;i>=0;i--){const e=gs.effects[i];e.t-=dt;e.r=e.maxR*(1-Math.max(0,e.t)/e.maxT);if(e.t<=0)gs.effects.splice(i,1)}
}

function findById(gs,id){if(!id)return null;if(gs.players[id])return gs.players[id];if(id==='base_blue')return gs.bases.blue;if(id==='base_red')return gs.bases.red;return gs.units.find(u=>u.id===id)||null}

function findNearestEnemy(gs,from,maxDist,allowNeutral){
  let best=null,bestD=maxDist;
  for(const u of gs.units){if(u.hp<=0||u.team===from.team)continue;if(u.team==='neutral'&&!allowNeutral)continue;const d=Math.hypot(u.x-from.x,u.y-from.y)-u.r;if(d<bestD){bestD=d;best=u}}
  for(const id in gs.players){const p=gs.players[id];if(p.dead||p.team===from.team)continue;const d=Math.hypot(p.x-from.x,p.y-from.y)-p.r;if(d<bestD){bestD=d;best=p}}
  for(const b of [gs.bases.blue,gs.bases.red]){if(b.team===from.team||b.hp<=0)continue;const d=Math.hypot(b.x-from.x,b.y-from.y)-b.r;if(d<bestD){bestD=d;best=b}}
  return best;
}

function hostDamage(gs,target,dmg,attackerId){
  if(target.hp<=0||target.dead)return;
  target.hp-=dmg;target.hurtFlash=.15;
  if(target.id==='base_blue'){if(target.hp<=0){target.hp=0;gs.gameOver=true;hostEndGame('red')}return}
  if(target.id==='base_red'){if(target.hp<=0){target.hp=0;gs.gameOver=true;hostEndGame('blue')}return}
  if(target.type==='neutral'&&attackerId){target.aggroId=attackerId;target.aggroTimer=6}
  if(target.type==='terror'&&attackerId){target.aggroId=attackerId;target.aggroTimer=10}
  if(target.hp<=0){
    target.hp=0;target.deathAnim=.5;
    if(gs.players[target.id]){
      target.dead=true;target.respawnTimer=6;target.input.dx=0;target.input.dy=0;target.attackHeld=false;
      if(target.id===myId)playSound('death');
      const killer=attackerId?gs.players[attackerId]:null;
      if(killer&&killer.id!==target.id){killer.kills++;if(killer.id===myId)playSound('hit');gs.floatTexts.push({x:target.x,y:target.y-30,text:'+200 XP',color:'#8cf',t:1.5,maxT:1.5});gainXP(killer,200)}
      return;
    }
    const attacker=attackerId?gs.players[attackerId]:null;
    if(attacker&&target.team!==attacker.team){
      attacker.kills++;
      if(target.type==='neutral'||target.type==='terror'){
        const shards=target.shardReward||1;
        attacker.shards=(attacker.shards||0)+shards;
        for(let i=0;i<shards;i++)gs.shardDrops.push({x:target.x+(Math.random()-.5)*30,y:target.y,toId:attacker.id,t:1.5});
      }
      gainXP(attacker,target.xpReward||10);
      if(target.type==='terror'&&attacker.id===myId)playSound('boom');
    }
  }
}

function gainXP(p,amount){
  p.xp+=amount;
  while(p.xp>=p.xpNext){
    p.xp-=p.xpNext;p.level++;p.xpNext=80+(p.level-1)*80;
    p.hpMax+=30;p.hp=Math.min(p.hpMax,p.hp+100);
    p.mpMax+=12;p.mp=Math.min(p.mpMax,p.mp+50);
    p.atkDamage+=2.5;
    if(p.id===myId)playSound('levelup');
    for(const k of ['Q','W','E','R'])if(!p.abil[k].unlocked&&p.level>=ABIL_UNLOCK[k]){p.abil[k].unlocked=true;p.abil[k].level=1;break}
  }
}

function tryAttack(p){
  if(p.atkTimer>0||p.dead)return;
  const t=findNearestEnemy(host.gameState,p,p.atkRange,true);
  if(!t)return;
  p.atkTimer=p.atkCooldown;p.attackAnim=.3;
  if(p.id===myId)playSound('attack');
  const tid=t.id||(t===host.gameState.bases.blue?'base_blue':t===host.gameState.bases.red?'base_red':null);
  host.gameState.bullets.push({x:p.x,y:p.y,targetId:tid,dmg:p.atkDamage,attackerId:p.id,speed:560,life:2.5,color:p.team==='blue'?'#8cf':'#f96'});
}

function hostCast(p,key){
  if(p.dead||!p.abil[key].unlocked||p.abil[key].cd>0)return;
  if(p.mp<ABIL[key].mana)return;
  p.mp-=ABIL[key].mana;p.abil[key].cd=ABIL[key].cooldown*(p.spellCdMul||1);p.castAnim=.4;
  if(p.id===myId)playSound('ability');
  const gs=host.gameState;
  if(key==='Q'){
    gs.effects.push({x:p.x,y:p.y,r:0,maxR:ABIL.Q.radius,t:.45,maxT:.45,color:'#8af'});
    for(const u of gs.units){if(u.hp<=0||u.team===p.team)continue;if(Math.hypot(u.x-p.x,u.y-p.y)<ABIL.Q.radius+u.r)hostDamage(gs,u,ABIL.Q.dmg,p.id)}
    for(const id in gs.players){const pl=gs.players[id];if(pl.id===p.id||pl.dead||pl.team===p.team)continue;if(Math.hypot(pl.x-p.x,pl.y-p.y)<ABIL.Q.radius+pl.r)hostDamage(gs,pl,ABIL.Q.dmg,p.id)}
  }
  else if(key==='W'){p.hp=Math.min(p.hpMax,p.hp+ABIL.W.heal);gs.effects.push({x:p.x,y:p.y,r:0,maxR:100,t:.5,maxT:.5,color:'#6f6'})}
  else if(key==='E'){
    const dx=p.input.dx,dy=p.input.dy;let nx=dx,ny=dy;
    if(Math.hypot(nx,ny)<.1){nx=0;ny=-1}
    const len=Math.hypot(nx,ny);nx/=len;ny/=len;
    p.x+=nx*ABIL.E.distance;p.y+=ny*ABIL.E.distance;
    p.x=Math.max(p.r,Math.min(WORLD.w-p.r,p.x));p.y=Math.max(p.r,Math.min(WORLD.h-p.r,p.y));
    gs.effects.push({x:p.x,y:p.y,r:0,maxR:60,t:.4,maxT:.4,color:'#fd6'});
    if(ABIL.E.damage){for(const u of gs.units){if(u.hp<=0||u.team===p.team)continue;if(Math.hypot(u.x-p.x,u.y-p.y)<50+u.r)hostDamage(gs,u,ABIL.E.damage,p.id)}}
  }
  else if(key==='R'){
    if(p.id===myId)playSound('boom');
    gs.effects.push({x:p.x,y:p.y,r:0,maxR:ABIL.R.radius,t:.7,maxT:.7,color:'#f8f'});
    for(const u of gs.units){if(u.hp<=0||u.team===p.team)continue;if(Math.hypot(u.x-p.x,u.y-p.y)<ABIL.R.radius+u.r){hostDamage(gs,u,ABIL.R.dmg,p.id);u.stunTimer=ABIL.R.stun}}
    for(const id in gs.players){const pl=gs.players[id];if(pl.id===p.id||pl.dead||pl.team===p.team)continue;if(Math.hypot(pl.x-p.x,pl.y-p.y)<ABIL.R.radius+pl.r){hostDamage(gs,pl,ABIL.R.dmg,p.id);pl.stunTimer=ABIL.R.stun}}
  }
}

function hostEndGame(w){hostBroadcast({type:'gameover',winner:w});showMsg(w==='blue'?'🏆 Синие!':'🏆 Красные!','#4f4',0)}

function spawnWave(gs){
  if(gs.units.filter(u=>u.type==='minion').length>70)return;
  for(let li=0;li<3;li++)for(let i=0;i<3;i++){
    const a=Math.random()*6.28,b=Math.random()*6.28;
    gs.units.push({id:'mb'+Math.random().toString(36).slice(2,9),type:'minion',team:'blue',x:BASES.blue.x+Math.cos(a)*30,y:BASES.blue.y+Math.sin(a)*30,dir:0,walking:false,r:15,hp:80,hpMax:80,speed:85,atkRange:75,atkDamage:10,atkCooldown:.95,atkTimer:0,laneIdx:li,waypointIdx:0,attackAnim:0,hurtFlash:0});
    gs.units.push({id:'mr'+Math.random().toString(36).slice(2,9),type:'minion',team:'red',x:BASES.red.x+Math.cos(b)*30,y:BASES.red.y+Math.sin(b)*30,dir:Math.PI,walking:false,r:15,hp:80,hpMax:80,speed:85,atkRange:75,atkDamage:10,atkCooldown:.95,atkTimer:0,laneIdx:li,waypointIdx:LANES[li].length-1,attackAnim:0,hurtFlash:0});
  }
}

function updateUnit(u,dt,gs){
  if(u.hp<=0)return;
  if(u.stunTimer>0){u.stunTimer-=dt;return}
  u.atkTimer=Math.max(0,u.atkTimer-dt);u.walking=false;
  if(u.type==='tower'){
    let target=null,bestD=Infinity,mt=null,mD=Infinity;
    for(const x of gs.units){if(x.hp<=0||x.team===u.team||x.team==='neutral')continue;const d=Math.hypot(x.x-u.x,x.y-u.y)-x.r;if(d>u.atkRange)continue;if(x.type==='minion'){if(d<mD){mD=d;mt=x}}}
    if(mt)target=mt;else for(const id in gs.players){const p=gs.players[id];if(p.dead||p.team===u.team)continue;const d=Math.hypot(p.x-u.x,p.y-u.y)-p.r;if(d<=u.atkRange&&d<bestD){bestD=d;target=p}}
    if(target){u.dir=Math.atan2(target.y-u.y,target.x-u.x);if(u.atkTimer<=0){u.atkTimer=u.atkCooldown;if(Math.random()<.3)playSound('tower');const tid=target.id||(target===gs.bases.blue?'base_blue':target===gs.bases.red?'base_red':null);gs.bullets.push({x:u.x,y:u.y,targetId:tid,dmg:u.atkDamage,attackerId:null,speed:520,life:2.5,color:u.team==='blue'?'#6cf':'#f96'})}}
    return;
  }
  if(u.type==='minion'){
    const t=findNearestEnemy(gs,u,260,false);
    if(t){const d=Math.hypot(t.x-u.x,t.y-u.y)-(t.r||0);if(d<=u.atkRange){u.dir=Math.atan2(t.y-u.y,t.x-u.x);if(u.atkTimer<=0){u.atkTimer=u.atkCooldown;u.attackAnim=.25;const tid=t.id||(t===gs.bases.blue?'base_blue':t===gs.bases.red?'base_red':null);gs.bullets.push({x:u.x,y:u.y,targetId:tid,dmg:u.atkDamage,attackerId:null,speed:520,life:2.5,color:u.team==='blue'?'#6cf':'#f96'})}}else{const dx=t.x-u.x,dy=t.y-u.y,dd=Math.hypot(dx,dy)||1;u.x+=dx/dd*u.speed*dt;u.y+=dy/dd*u.speed*dt;u.dir=Math.atan2(dy,dx);u.walking=true}return}
    const lane=LANES[u.laneIdx];if(!lane)return;
    const dir=u.team==='blue'?1:-1;let wp=u.waypointIdx+dir;
    if(wp<0||wp>=lane.length){const eb=u.team==='blue'?gs.bases.red:gs.bases.blue;const d=Math.hypot(eb.x-u.x,eb.y-u.y)-eb.r;if(d<=u.atkRange){u.dir=Math.atan2(eb.y-u.y,eb.x-u.x);if(u.atkTimer<=0){u.atkTimer=u.atkCooldown;u.attackAnim=.25;gs.bullets.push({x:u.x,y:u.y,targetId:u.team==='blue'?'base_red':'base_blue',dmg:u.atkDamage,attackerId:null,speed:520,life:2.5,color:u.team==='blue'?'#6cf':'#f96'})}}else{const dx=eb.x-u.x,dy=eb.y-u.y,dd=Math.hypot(dx,dy)||1;u.x+=dx/dd*u.speed*dt;u.y+=dy/dd*u.speed*dt;u.dir=Math.atan2(dy,dx);u.walking=true}return}
    const w=lane[wp];if(Math.hypot(w.x-u.x,w.y-u.y)<30)u.waypointIdx=wp;else{const dx=w.x-u.x,dy=w.y-u.y,dd=Math.hypot(dx,dy)||1;u.x+=dx/dd*u.speed*dt;u.y+=dy/dd*u.speed*dt;u.dir=Math.atan2(dy,dx);u.walking=true}
    return;
  }
  // Терзатель — мощный, преследует в большом радиусе
  if(u.type==='terror'){
    if(u.aggroTimer>0&&u.aggroId){u.aggroTimer-=dt;const tgt=gs.players[u.aggroId];if(!tgt||tgt.dead){u.aggroId=null;u.aggroTimer=0}else{const d=Math.hypot(tgt.x-u.x,tgt.y-u.y)-tgt.r;u.dir=Math.atan2(tgt.y-u.y,tgt.x-u.x);if(d<=u.atkRange){if(u.atkTimer<=0){u.atkTimer=u.atkCooldown;u.attackAnim=.4;hostDamage(gs,tgt,u.atkDamage,null);playSound('boss')}}else{const dx=tgt.x-u.x,dy=tgt.y-u.y,dd=Math.hypot(dx,dy)||1;u.x+=dx/dd*u.speed*dt;u.y+=dy/dd*u.speed*dt;u.walking=true}if(Math.hypot(u.x-u.campX,u.y-u.campY)>700){u.aggroId=null;u.aggroTimer=0}return}}
    // Автоагр если игрок близко
    for(const id in gs.players){const p=gs.players[id];if(p.dead)continue;if(Math.hypot(p.x-u.x,p.y-u.y)<250){u.aggroId=id;u.aggroTimer=10;break}}
    // Возврат домой
    const dHome=Math.hypot(u.x-u.campX,u.y-u.campY);
    if(dHome>20){const dx=u.campX-u.x,dy=u.campY-u.y,dd=Math.hypot(dx,dy)||1;u.x+=dx/dd*u.speed*dt;u.y+=dy/dd*u.speed*dt;u.dir=Math.atan2(dy,dx);u.walking=true;return}
    u.wanderTimer-=dt;if(u.wanderTimer<=0){u.wanderTimer=2+Math.random()*2;u.wanderAngle=Math.random()*6.28}
    const nx=u.x+Math.cos(u.wanderAngle)*u.speed*.2*dt,ny=u.y+Math.sin(u.wanderAngle)*u.speed*.2*dt;
    if(Math.hypot(nx-u.campX,ny-u.campY)<u.campR*.5){u.x=nx;u.y=ny;u.dir=u.wanderAngle;u.walking=true}
    return;
  }
  if(u.type==='neutral'){
    if(u.aggroTimer>0&&u.aggroId){u.aggroTimer-=dt;const tgt=gs.players[u.aggroId];if(!tgt||tgt.dead){u.aggroId=null;u.aggroTimer=0}else{const d=Math.hypot(tgt.x-u.x,tgt.y-u.y)-tgt.r;u.dir=Math.atan2(tgt.y-u.y,tgt.x-u.x);if(d<=u.atkRange){if(u.atkTimer<=0){u.atkTimer=u.atkCooldown;u.attackAnim=.3;hostDamage(gs,tgt,u.atkDamage,null)}}else{const dx=tgt.x-u.x,dy=tgt.y-u.y,dd=Math.hypot(dx,dy)||1;u.x+=dx/dd*u.speed*dt;u.y+=dy/dd*u.speed*dt;u.walking=true}if(Math.hypot(u.x-u.campX,u.y-u.campY)>500){u.aggroId=null;u.aggroTimer=0}return}}
    const dHome=Math.hypot(u.x-u.campX,u.y-u.campY);
    if(dHome>20){const dx=u.campX-u.x,dy=u.campY-u.y,dd=Math.hypot(dx,dy)||1;const nx=u.x+dx/dd*u.speed*dt,ny=u.y+dy/dd*u.speed*dt;if(!inRiver(nx,ny)&&!onLane(nx,ny,110)){u.x=nx;u.y=ny;u.dir=Math.atan2(dy,dx);u.walking=true}else{u.dir=Math.atan2(dy,dx);u.walking=true}return}
    u.wanderTimer-=dt;if(u.wanderTimer<=0){u.wanderTimer=1.5+Math.random()*2;u.wanderAngle=Math.random()*6.28}
    const nx=u.x+Math.cos(u.wanderAngle)*u.speed*.3*dt,ny=u.y+Math.sin(u.wanderAngle)*u.speed*.3*dt;
    if(Math.hypot(nx-u.campX,ny-u.campY)<u.campR*.8&&!inRiver(nx,ny)&&!onLane(nx,ny,100)){u.x=nx;u.y=ny;u.dir=u.wanderAngle;u.walking=true}
  }
}

function hostBuyItem(playerId,itemId){
  const p=host.gameState.players[playerId];if(!p)return;
  const item=NEUTRAL_ITEMS.find(i=>i.id===itemId);if(!item)return;
  if((p.shards||0)<item.cost)return;
  if(!p.inventory)p.inventory=[];
  if(p.inventory.includes(itemId))return;
  p.shards-=item.cost;
  const base=p.team==='blue'?host.gameState.bases.blue:host.gameState.bases.red;
  host.gameState.couriers.push({x:base.x+(Math.random()-.5)*80,y:base.y+(Math.random()-.5)*80,dir:0,walking:true,speed:180,ownerId:p.id,itemId});

}

function generateShortCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ';
  let s='';
  for(let i=0;i<6;i++)s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function tryCreatePeer(attempt){
  if(attempt>5){statusEl.textContent='Не могу создать комнату';return}
  statusEl.textContent='Создание комнаты... ('+(attempt+1)+')';
  const code=generateShortCode();
  const p=new Peer(code,{debug:1});
  p.on('open',id=>{
    peer=p;myId=id;myTeam='blue';
    document.getElementById('btnCreate').style.display='none';
    document.getElementById('btnJoinMode').style.display='none';
    document.getElementById('roomInfo').style.display='block';
    document.getElementById('roomId').textContent=id;
    document.getElementById('roomBadgeId').textContent=id;
    statusEl.textContent='✅ Готово! Отправь ID: '+id;
    hostInit();
    host.gameState.players[id]=createPlayer(id,'blue');
    p.on('connection',conn=>{clientConn=conn;addConn(conn)});
    setTimeout(()=>{startGame()},800);
  });
  p.on('error',err=>{
    if(err.type==='unavailable-id'){tryCreatePeer(attempt+1)}
    else{statusEl.textContent='Ошибка: '+err.type}
  });
}
document.getElementById('btnCreate').addEventListener('click',()=>{initAudio();isHost=true;tryCreatePeer(0)});

function addConn(conn){
  const open=()=>{
    if(!host.gameState.players[conn.peer])host.gameState.players[conn.peer]=createPlayer(conn.peer,'red');
    conn.send(JSON.stringify({type:'welcome',yourId:conn.peer,team:'red'}));
    showMsg('🔗 Игрок подключился!','#4f4',2000);
  };
  if(conn.open)open();else conn.on('open',open);
  conn.on('data',data=>{try{const m=JSON.parse(data);const p=host.gameState.players[conn.peer];if(!p)return;if(m.type==='input'){p.input.dx=m.dx;p.input.dy=m.dy}else if(m.type==='attack'){p.attackHeld=!!m.held}else if(m.type==='cast'){hostCast(p,m.key)}else if(m.type==='buy'){hostBuyItem(conn.peer,m.itemId)}}catch(e){}});
  conn.on('close',()=>{if(host.gameState&&host.gameState.players[conn.peer])delete host.gameState.players[conn.peer];clientConn=null});
}

document.getElementById('btnJoin').addEventListener('click',()=>{
  let hostId=document.getElementById('hostIdInput').value.trim().toUpperCase().replace(/[^A-Z]/g,'');
  if(!hostId){statusEl.textContent='Пустое поле!';return}
  if(hostId.length<4){statusEl.textContent='ID слишком короткий';return}
  isHost=false;
  statusEl.textContent='Подключение к '+hostId+'...';
  let attempts=0;
  const maxAttempts=4;
  function attemptConnect(){
    attempts++;
    statusEl.textContent='Попытка '+attempts+'/'+maxAttempts+' → '+hostId;
    const p=new Peer(null,{debug:1});
    p.on('open',id=>{
      setTimeout(()=>{
        const conn=p.connect(hostId,{reliable:true});
        hostConn=conn;
        let opened=false;
        const timeout=setTimeout(()=>{
          if(!opened){try{p.destroy()}catch(e){}if(attempts<maxAttempts){setTimeout(attemptConnect,1500)}else{statusEl.textContent='ID не найден. Проверь код и Wi-Fi'}}
        },5000);
        conn.on('open',()=>{opened=true;clearTimeout(timeout);peer=p;statusEl.textContent='✅ Подключено!';});
        conn.on('data',data=>{try{const m=JSON.parse(data);if(m.type==='welcome'){myId=m.yourId;myTeam=m.team;if(!gameStarted)startGame();statusEl.textContent='Игра началась!';}else if(m.type==='state'){remoteState=m;if(!gameStarted)startGame();}else if(m.type==='gameover'){showMsg(m.winner===myTeam?'🏆 Победа!':'💀 Поражение',m.winner===myTeam?'#4f4':'#f44',0);}}catch(e){}});
        conn.on('error',()=>{clearTimeout(timeout);if(!opened&&attempts<maxAttempts)setTimeout(attemptConnect,1500);else statusEl.textContent='Ошибка соединения';});
        conn.on('close',()=>{showMsg('Соединение потеряно','#f44',3000)});
      },600);
    });
    p.on('error',err=>{
      if(err.type==='peer-unavailable'){if(attempts<maxAttempts){setTimeout(attemptConnect,1500)}else{statusEl.textContent='❌ ID не найден. Убедись что друг нажал "Создать игру"'}}
      else{statusEl.textContent='Ошибка: '+err.type;}
    });
  }
  attemptConnect();
});

function setJoy(t){const r=joyBase.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=t.clientX-cx,dy=t.clientY-cy;const max=r.width/2-18,len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max}joyKnob.style.left=(r.width/2-30+dx)+'px';joyKnob.style.top=(r.height/2-30+dy)+'px';input.dx=dx/max;input.dy=dy/max}

// Улучшенная тень с несколькими слоями
function drawShadow(x,y,rx,ry,a){
  const g=ctx.createRadialGradient(x,y,rx*.2,x,y,rx);
  g.addColorStop(0,'rgba(0,0,0,'+(a||.5)+')');
  g.addColorStop(.5,'rgba(0,0,0,'+((a||.5)*.5)+')');
  g.addColorStop(.8,'rgba(0,0,0,'+((a||.5)*.15)+')');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();
}

// Улучшенная отрисовка персонажа с 3D-эффектами
function drawChar3D(sx,sy,u,style,myTeam){
  const t=performance.now()*.001,r=u.r;
  let ds=1,da=1;
  if(u.deathAnim>0){const k=1-u.deathAnim/.5;ds=1-k*.6;da=1-k*.8}
  const wp=u.walking?(performance.now()*.012+(u.x+u.y)*.05):0;
  const bobY=u.walking?Math.abs(Math.sin(wp))*3.5:Math.sin(t*1.5+u.x*.01)*1.2;
  const legSwing=Math.sin(wp)*r*.55;
  const armSwing=Math.sin(wp+Math.PI)*r*.32;
  const atkAnim=u.attackAnim>0?Math.sin((1-u.attackAnim/.3)*Math.PI):0;
  ctx.save();ctx.globalAlpha=da;

  // === МНОГОСЛОЙНАЯ ТЕНЬ ===
  drawShadow(sx,sy+r*.95,r*1.7,r*.6,.55);
  drawShadow(sx+2,sy+r*1.0,r*1.2,r*.4,.3);

  // === ОТРАЖЕНИЕ НА ЗЕМЛЕ (ambient occlusion) ===
  const ao=ctx.createRadialGradient(sx,sy+r*.8,0,sx,sy+r*.8,r*1.3);
  ao.addColorStop(0,'rgba(0,0,0,.35)');
  ao.addColorStop(.5,'rgba(0,0,0,.15)');
  ao.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=ao;ctx.beginPath();ctx.ellipse(sx,sy+r*.8,r*1.3,r*.5,0,0,Math.PI*2);ctx.fill();

  ctx.translate(sx,sy-bobY);ctx.scale(ds,ds);
  const isAlly = u.team === myTeam;
  const auraColor = u.team === 'neutral' ? (u.terror?'255,120,0':'200,200,80') : (isAlly ? '80,180,255' : '255,60,60');

  // === АУРА ===
  if(u.terror){
    // Двойная аура для терзателя
    const auraG1 = ctx.createRadialGradient(0,r*.9,0,0,r*.9,r*3);
    auraG1.addColorStop(0,'rgba(255,60,0,.25)');
    auraG1.addColorStop(.5,'rgba(200,0,50,.15)');
    auraG1.addColorStop(1,'rgba(100,0,0,0)');
    ctx.fillStyle=auraG1;ctx.beginPath();ctx.ellipse(0,r*.9,r*3,r*1.2,0,0,Math.PI*2);ctx.fill();
    const auraG2 = ctx.createRadialGradient(0,r*.9,0,0,r*.9,r*1.9);
    auraG2.addColorStop(0,'rgba(255,150,50,.4)');
    auraG2.addColorStop(.7,'rgba(255,80,0,.2)');
    auraG2.addColorStop(1,'rgba(150,0,0,0)');
    ctx.fillStyle=auraG2;ctx.beginPath();ctx.ellipse(0,r*.9,r*1.9,r*.7,0,0,Math.PI*2);ctx.fill();
  } else {
    const auraG = ctx.createRadialGradient(0,r*.9,0,0,r*.9,r*1.9);
    auraG.addColorStop(0,'rgba('+auraColor+',0)');
    auraG.addColorStop(.6,'rgba('+auraColor+',.15)');
    auraG.addColorStop(1,'rgba('+auraColor+',0)');
    ctx.fillStyle=auraG;ctx.beginPath();ctx.ellipse(0,r*.9,r*1.9,r*.65,0,0,Math.PI*2);ctx.fill();
  }

  // === ДЕМОНИЧЕСКИЕ КРЫЛЬЯ ДЛЯ ТЕРЗАТЕЛЯ ===
  if(u.terror){
    const wingWave=Math.sin(t*3)*.15;
    // Левое крыло
    ctx.save();ctx.translate(-r*.3,-r*.4);ctx.rotate(-wingWave);
    const wg1=ctx.createLinearGradient(0,0,-r*2.5,r*1.2);
    wg1.addColorStop(0,'#5a0a0a');wg1.addColorStop(.5,'#8a1010');wg1.addColorStop(1,'#2a0000');
    ctx.fillStyle=wg1;
    ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-r*1.8,-r*1.2,-r*2.4,r*.2);ctx.quadraticCurveTo(-r*1.8,r*.6,-r*1.2,r*.3);ctx.quadraticCurveTo(-r*.7,r*.5,0,0);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,80,0,.6)';ctx.lineWidth=1.5;ctx.stroke();
    // Прожилки
    ctx.strokeStyle='rgba(255,120,40,.5)';ctx.lineWidth=1;
    for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(-r*.1,0);ctx.lineTo(-r*1.5+i*r*.2,-r*.5+i*r*.3);ctx.stroke()}
    ctx.restore();
    // Правое крыло
    ctx.save();ctx.translate(r*.3,-r*.4);ctx.rotate(wingWave);
    const wg2=ctx.createLinearGradient(0,0,r*2.5,r*1.2);
    wg2.addColorStop(0,'#5a0a0a');wg2.addColorStop(.5,'#8a1010');wg2.addColorStop(1,'#2a0000');
    ctx.fillStyle=wg2;
    ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(r*1.8,-r*1.2,r*2.4,r*.2);ctx.quadraticCurveTo(r*1.8,r*.6,r*1.2,r*.3);ctx.quadraticCurveTo(r*.7,r*.5,0,0);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,80,0,.6)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.strokeStyle='rgba(255,120,40,.5)';ctx.lineWidth=1;
    for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(r*.1,0);ctx.lineTo(r*1.5-i*r*.2,-r*.5+i*r*.3);ctx.stroke()}
    ctx.restore();
  }

  // === НОГИ ===
  const legG=ctx.createLinearGradient(0,0,0,r);legG.addColorStop(0,style.body);legG.addColorStop(1,'#000');
  ctx.fillStyle=legG;
  ctx.beginPath();ctx.ellipse(-r*.32+legSwing*.1,r*.65,r*.2,r*.45,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(r*.32-legSwing*.1,r*.65,r*.2,r*.45,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=style.bodyDark||'#1a0a04';
  ctx.beginPath();ctx.ellipse(-r*.32+legSwing*.1,r*.95,r*.25,r*.12,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(r*.32-legSwing*.1,r*.95,r*.25,r*.12,0,0,Math.PI*2);ctx.fill();

  // === ПЛАЩ ===
  if(style.isHero){
    const capeG=ctx.createLinearGradient(-r,-r,r,r);
    capeG.addColorStop(0,style.capeLight||style.cape);capeG.addColorStop(1,style.capeDark||style.cape);
    ctx.fillStyle=capeG;

    ctx.moveTo(r*.5,-r*2);

    ctx.quadraticCurveTo(r*1.4,-r*1.5,r*1.0,-r*1.6);
    ctx.quadraticCurveTo(r*.7,-r*1.75,r*.5,-r*2);

function drawHpBar3D(u,sx,sy,isMe,myTeam){
  const w=u.type==='tower'?70:(u.type==='base'?160:(u.terror?90:52)),h=u.type==='base'?12:(u.terror?10:7);
  const y=sy-u.r*1.9-(u.type==='base'?30:0)-(u.terror?10:0);
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(sx-w/2-3,y-3,w+6,h+6);
  ctx.fillStyle='#000';ctx.fillRect(sx-w/2-2,y-2,w+4,h+4);
  ctx.fillStyle='#1a0a0a';ctx.fillRect(sx-w/2,y,w,h);
  const ratio=Math.max(0,u.hp/u.hpMax);
  let c1,c2;
  if(u.terror){c1='#ff4040';c2='#5a0000'}
  else if(u.type==='neutral'){c1='#ffd966';c2='#8a6a20'}
  else if(u.team==='blue'){c1='#8fd8ff';c2='#0a3a7a'}
  else{c1='#ff8888';c2='#7a1010'}
  const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,c1);g.addColorStop(.5,c1);g.addColorStop(1,c2);
  ctx.fillStyle=g;ctx.fillRect(sx-w/2,y,w*ratio,h);
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(sx-w/2,y,w*ratio,2);
  if(isMe){ctx.strokeStyle='#6f6';ctx.lineWidth=1.5;ctx.strokeRect(sx-w/2-3,y-3,w+6,h+6)}
  if(u.type!=='tower'&&u.type!=='base'&&u.type!=='minion'){
    const isAlly = u.team === myTeam;
    const lbl = u.terror ? '☠ ТЕРЗАТЕЛЬ' : (isMe ? 'ТЫ' : (u.team === 'neutral' ? 'КРИП' : (isAlly ? 'СОЮЗНИК' : 'ВРАГ')));
    const color = u.terror ? '#ff4040' : (isMe ? '#8fff8f' : (u.team === 'neutral' ? '#fd8' : (isAlly ? '#8cf' : '#f88')));
    ctx.fillStyle=color;ctx.font=u.terror?'bold 13px Arial':'bold 11px Arial';ctx.textAlign='center';
    ctx.strokeStyle='#000';ctx.lineWidth=4;ctx.strokeText(lbl,sx,y-5);
    ctx.fillStyle=color;ctx.fillText(lbl,sx,y-5);
  }
}

function drawBase3D(b,camera,myTeam){

  if(sx<-300||sy<-300||sx>W+300||sy>H+300)return;
  const isBlue=b.team==='blue',light=isBlue?'#6cb8ff':'#ff8a6c',main=isBlue?'#1a5faf':'#af1a1a',dark=isBlue?'#051a3a':'#3a0505';

  ctx.fillStyle=dark;ctx.beginPath();ctx.ellipse(sx,sy+b.r*.3,b.r*1.15,b.r*.92,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=light;ctx.lineWidth=7;ctx.beginPath();ctx.ellipse(sx,sy+b.r*.3,b.r*1.15,b.r*.92,0,0,Math.PI*2);ctx.stroke();
  const mg=ctx.createRadialGradient(sx-25,sy-35,10,sx,sy-10,b.r*.85);
  mg.addColorStop(0,light);mg.addColorStop(.6,main);mg.addColorStop(1,dark);

  const tg=ctx.createLinearGradient(sx-40,sy-85,sx+40,sy+25);
  tg.addColorStop(0,'#fff');tg.addColorStop(.4,light);tg.addColorStop(1,main);
  ctx.fillStyle=tg;
  ctx.beginPath();ctx.moveTo(sx-38,sy-15);ctx.lineTo(sx-28,sy-68);ctx.lineTo(sx,sy-88);ctx.lineTo(sx+28,sy-68);ctx.lineTo(sx+38,sy-15);ctx.lineTo(sx+22,sy+25);ctx.lineTo(sx-22,sy+25);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.stroke();

}

function drawTree3D(t,camera){
  const sx=t.x-camera.x,sy=t.y-camera.y;
  if(sx<-80||sy<-80||sx>W+80||sy>H+80)return;
  const swayX=Math.sin(performance.now()*.001*t.swaySpeed+t.sway)*2.5;
  drawShadow(sx+3,sy+t.r*.9,t.r*1.05,t.r*.4,.5);
  const tg=ctx.createLinearGradient(sx-t.r*.3,0,sx+t.r*.3,0);
  tg.addColorStop(0,'#0a0502');tg.addColorStop(.4,'#5a3a20');tg.addColorStop(.6,'#7a5a30');tg.addColorStop(1,'#1a0a04');
  ctx.fillStyle=tg;
  ctx.beginPath();ctx.moveTo(sx-t.r*.28,sy+t.r*.45);ctx.lineTo(sx-t.r*.18,sy-t.r*.25);ctx.lineTo(sx+t.r*.18,sy-t.r*.25);ctx.lineTo(sx+t.r*.28,sy+t.r*.45);ctx.closePath();ctx.fill();
  // Корни
  ctx.strokeStyle='#3a2010';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(sx-t.r*.28,sy+t.r*.45);ctx.lineTo(sx-t.r*.45,sy+t.r*.55);ctx.stroke();
  ctx.beginPath();ctx.moveTo(sx+t.r*.28,sy+t.r*.45);ctx.lineTo(sx+t.r*.45,sy+t.r*.55);ctx.stroke();
  if(t.type==='pine'){
    for(let i=0;i<5;i++){
      const yTop=sy-t.r*.5-i*t.r*.45+swayX*(1-i*.15);
      const size=t.r*(1.15-i*.19);
      const pg=ctx.createRadialGradient(sx-size*.3,yTop-size*.4,size*.2,sx,yTop,size);
      pg.addColorStop(0,'#4aaa30');pg.addColorStop(.5,'#1a5a1a');pg.addColorStop(1,'#052005');
      ctx.fillStyle=pg;
      ctx.beginPath();ctx.moveTo(sx+swayX*(1-i*.1),yTop-t.r*.8);ctx.lineTo(sx-size,yTop);ctx.lineTo(sx+size,yTop);ctx.closePath();ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1;ctx.stroke();
    }
  } else {
    const cg=ctx.createRadialGradient(sx-t.r*.5+swayX,sy-t.r*1.2,t.r*.2,sx,sy-t.r*.8,t.r*1.5);
    cg.addColorStop(0,'#7aca5a');cg.addColorStop(.4,'#2a7a1a');cg.addColorStop(.7,'#1a5a1a');cg.addColorStop(1,'#062a06');
    ctx.fillStyle=cg;
    ctx.beginPath();
    ctx.arc(sx+swayX,sy-t.r*1.0,t.r*1.15,0,Math.PI*2);
    ctx.arc(sx-t.r*.7+swayX,sy-t.r*.7,t.r*.9,0,Math.PI*2);
    ctx.arc(sx+t.r*.6+swayX,sy-t.r*.8,t.r*.95,0,Math.PI*2);
    ctx.arc(sx+swayX,sy-t.r*1.5,t.r*.7,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='rgba(200,255,150,.3)';
    ctx.beginPath();ctx.arc(sx-t.r*.4+swayX,sy-t.r*1.3,t.r*.4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(sx+t.r*.3+swayX,sy-t.r*1.4,t.r*.35,0,Math.PI*2);ctx.fill();
  }
}

function drawDeco3D(d,camera){
  const sx=d.x-camera.x,sy=d.y-camera.y;
  if(sx<-60||sy<-60||sx>W+60||sy>H+60)return;
  if(d.type==='rock'){
    drawShadow(sx+2,sy+d.r*.6,d.r*.95,d.r*.38,.45);
    const g=ctx.createRadialGradient(sx-d.r*.4,sy-d.r*.5,d.r*.1,sx,sy,d.r*1.2);
    g.addColorStop(0,'#d0d0d0');g.addColorStop(.4,'#8a8a8a');g.addColorStop(.7,'#4a4a4a');g.addColorStop(1,'#1a1a1a');
    ctx.fillStyle=g;
    ctx.beginPath();
    for(let i=0;i<7;i++){const a=i/7*Math.PI*2,rr=d.r*(.85+Math.sin(i*3+d.seed*10)*.18);if(i===0)ctx.moveTo(sx+Math.cos(a)*rr,sy+Math.sin(a)*rr*.85);else ctx.lineTo(sx+Math.cos(a)*rr,sy+Math.sin(a)*rr*.85)}
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.5)';
    ctx.beginPath();ctx.ellipse(sx-d.r*.35,sy-d.r*.45,d.r*.35,d.r*.18,-.5,0,Math.PI*2);ctx.fill();
  } else if(d.type==='bush'){
    drawShadow(sx,sy+d.r*.6,d.r*1.15,d.r*.42,.4);
    const g=ctx.createRadialGradient(sx-d.r*.35,sy-d.r*.5,d.r*.1,sx,sy,d.r*1.35);
    g.addColorStop(0,'#5aba40');g.addColorStop(.4,'#2a7a1a');g.addColorStop(1,'#052005');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,sy,d.r*1.15,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#e83a3a';
    for(let i=0;i<4;i++){const a=d.seed*6+i*1.5;ctx.beginPath();ctx.arc(sx+Math.cos(a)*d.r*.6,sy+Math.sin(a)*d.r*.45,2.2,0,Math.PI*2);ctx.fill()}
  } else if(d.type==='flower'){
    const colors=['#ff6','#f6f','#6ff','#fff','#f88','#ff8'];
    ctx.fillStyle=colors[Math.floor(d.seed*colors.length)];
    for(let i=0;i<5;i++){const a=i*Math.PI*2/5+d.seed*6;ctx.beginPath();ctx.ellipse(sx+Math.cos(a)*3,sy+Math.sin(a)*3,2.5,1.8,a,0,Math.PI*2);ctx.fill()}
    ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(sx,sy,1.5,0,Math.PI*2);ctx.fill();
  } else if(d.type==='ruin'){
    drawShadow(sx,sy+d.r*.6,d.r*1.15,d.r*.42,.5);
    const g=ctx.createLinearGradient(sx-d.r*.5,0,sx+d.r*.5,0);
    g.addColorStop(0,'#3a3020');g.addColorStop(.4,'#c0b090');g.addColorStop(.7,'#8a7a60');g.addColorStop(1,'#3a3020');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.moveTo(sx-d.r*.55,sy+d.r*.55);ctx.lineTo(sx-d.r*.45,sy-d.r*.95);ctx.lineTo(sx+d.r*.1,sy-d.r*1.35);ctx.lineTo(sx+d.r*.6,sy+d.r*.55);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=1.5;ctx.stroke();
  } else if(d.type==='grass'){
    ctx.strokeStyle='rgba(40,100,40,.9)';ctx.lineWidth=1.3;
    for(let i=0;i<6;i++){const a=-Math.PI/2+(i-2.5)*.28;ctx.beginPath();ctx.moveTo(sx,sy+d.r);ctx.quadraticCurveTo(sx+Math.cos(a)*d.r*.7,sy+d.r-Math.abs(Math.sin(a))*d.r*.9,sx+Math.cos(a)*d.r*1.1,sy+d.r-Math.abs(Math.sin(a))*d.r*1.6);ctx.stroke()}
  } else if(d.type==='mushroom'){
    drawShadow(sx,sy+d.r*.5,d.r*.8,d.r*.28,.4);
    const sg=ctx.createLinearGradient(sx-d.r*.18,0,sx+d.r*.18,0);
    sg.addColorStop(0,'#7a7060');sg.addColorStop(.4,'#f0e8d0');sg.addColorStop(1,'#7a7060');
    ctx.fillStyle=sg;ctx.fillRect(sx-d.r*.18,sy-d.r*.1,d.r*.36,d.r*.75);
    const cg=ctx.createRadialGradient(sx-d.r*.25,sy-d.r*.55,1,sx,sy-d.r*.3,d.r);
    cg.addColorStop(0,d.seed>.5?'#ff7070':'#ffc060');cg.addColorStop(.5,d.seed>.5?'#d03030':'#d07030');cg.addColorStop(1,d.seed>.5?'#5a0808':'#6a3008');
    ctx.fillStyle=cg;
    ctx.beginPath();ctx.ellipse(sx,sy-d.r*.2,d.r*.85,d.r*.6,0,Math.PI,0);ctx.fill();
    ctx.fillStyle='#fff';
    for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(sx-d.r*.5+i*d.r*.25,sy-d.r*.42,1.4,0,Math.PI*2);ctx.fill()}
  } else if(d.type==='log'){
    ctx.save();ctx.translate(sx,sy);ctx.rotate(d.angle);
    drawShadow(3,3,d.r*1.0,d.r*.38,.4);
    const g=ctx.createLinearGradient(0,-d.r*.45,0,d.r*.45);
    g.addColorStop(0,'#9a6a30');g.addColorStop(.4,'#6a4a20');g.addColorStop(1,'#2a1a08');
    ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,d.r*.95,d.r*.4,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=1.8;ctx.stroke();
    ctx.restore();
  } else if(d.type==='bones'){
    drawShadow(sx,sy+d.r*.3,d.r*.8,d.r*.25,.4);
    ctx.strokeStyle='#f0e8d0';ctx.lineWidth=3.5;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(sx-d.r*.55,sy);ctx.lineTo(sx+d.r*.55,sy);ctx.stroke();
    ctx.fillStyle='#f0e8d0';
    ctx.beginPath();ctx.arc(sx-d.r*.55,sy,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(sx+d.r*.55,sy,3,0,Math.PI*2);ctx.fill();
  } else if(d.type==='glowCrystal'){
    const pulse=1+Math.sin(performance.now()*.002+d.seed*10)*.3;
    ctx.shadowColor='#c8f';ctx.shadowBlur=25*pulse;
    const cg=ctx.createRadialGradient(sx,sy-d.r*.3,0,sx,sy-d.r*.3,d.r*pulse);
    cg.addColorStop(0,'#fff');cg.addColorStop(.4,'#e8d0ff');cg.addColorStop(.7,'#a890e0');cg.addColorStop(1,'#4050a0');
    ctx.fillStyle=cg;
    ctx.beginPath();ctx.moveTo(sx,sy-d.r*1.6*pulse);ctx.lineTo(sx+d.r*.75,sy-d.r*.3);ctx.lineTo(sx,sy+d.r*.55);ctx.lineTo(sx-d.r*.75,sy-d.r*.3);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1.2;ctx.stroke();ctx.shadowBlur=0;
  }
}

function drawGround3D(camera,trees,decorations){
  const bg=ctx.createRadialGradient(W/2,H/2,100,W/2,H/2,Math.max(W,H));
  bg.addColorStop(0,'#1e381a');bg.addColorStop(.5,'#142e12');bg.addColorStop(1,'#0a1a0a');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  const rng=mulberry32(3333);
  ctx.save();
  for(let i=0;i<1800;i++){
    const px=rng()*WORLD.w-camera.x,py=rng()*WORLD.h-camera.y;
    if(px<-10||py<-10||px>W+10||py>H+10)continue;
    const shades=['rgba(30,70,25,.7)','rgba(45,95,40,.6)','rgba(20,50,20,.6)','rgba(55,105,45,.5)','rgba(35,80,30,.55)'];
    ctx.strokeStyle=shades[Math.floor(rng()*shades.length)];ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+(rng()-.5)*6,py-3-rng()*5);ctx.stroke();
  }
  ctx.restore();
  const prng=mulberry32(1111);
  for(let i=0;i<60;i++){
    const px=prng()*WORLD.w-camera.x,py=prng()*WORLD.h-camera.y;
    const r=60+prng()*140;
    if(px<-r||py<-r||px>W+r||py>H+r)continue;
    const pg=ctx.createRadialGradient(px,py,0,px,py,r);
    pg.addColorStop(0,'rgba(0,25,0,.25)');pg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=pg;ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fill();
  }
  for(const path of SIDE_PATHS){
    ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=54;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(path[0].x-camera.x+3,path[0].y-camera.y+5);
    for(let i=1;i<path.length;i++)ctx.lineTo(path[i].x-camera.x+3,path[i].y-camera.y+5);
    ctx.stroke();
    ctx.strokeStyle='#4a3a20';ctx.lineWidth=50;
    ctx.beginPath();ctx.moveTo(path[0].x-camera.x,path[0].y-camera.y);
    for(let i=1;i<path.length;i++)ctx.lineTo(path[i].x-camera.x,path[i].y-camera.y);
    ctx.stroke();
    ctx.strokeStyle='#7a6a4a';ctx.lineWidth=44;
    ctx.beginPath();ctx.moveTo(path[0].x-camera.x,path[0].y-camera.y);
    for(let i=1;i<path.length;i++)ctx.lineTo(path[i].x-camera.x,path[i].y-camera.y);
    ctx.stroke();
  }
  for(const lane of LANES){
    ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=114;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(lane[0].x-camera.x,lane[0].y-camera.y+10);
    for(let i=1;i<lane.length;i++)ctx.lineTo(lane[i].x-camera.x,lane[i].y-camera.y+10);
    ctx.stroke();
    ctx.strokeStyle='#2a1a08';ctx.lineWidth=106;
    ctx.beginPath();ctx.moveTo(lane[0].x-camera.x,lane[0].y-camera.y);
    for(let i=1;i<lane.length;i++)ctx.lineTo(lane[i].x-camera.x,lane[i].y-camera.y);
    ctx.stroke();
    ctx.strokeStyle='#7a6a4a';ctx.lineWidth=90;
    ctx.beginPath();ctx.moveTo(lane[0].x-camera.x,lane[0].y-camera.y);
    for(let i=1;i<lane.length;i++)ctx.lineTo(lane[i].x-camera.x,lane[i].y-camera.y);
    ctx.stroke();
    ctx.strokeStyle='#9a8a6a';ctx.lineWidth=62;
    ctx.beginPath();ctx.moveTo(lane[0].x-camera.x-8,lane[0].y-camera.y-6);
    for(let i=1;i<lane.length;i++)ctx.lineTo(lane[i].x-camera.x-8,lane[i].y-camera.y-6);
    ctx.stroke();
    ctx.strokeStyle='rgba(230,210,170,.4)';ctx.lineWidth=2.5;
    ctx.setLineDash([16,20]);
    ctx.beginPath();ctx.moveTo(lane[0].x-camera.x,lane[0].y-camera.y);
    for(let i=1;i<lane.length;i++)ctx.lineTo(lane[i].x-camera.x,lane[i].y-camera.y);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.save();ctx.lineCap='round';
  ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=380;
  ctx.beginPath();ctx.moveTo(600-camera.x,600-camera.y);ctx.lineTo(3000-camera.x,3000-camera.y);ctx.stroke();
  ctx.strokeStyle='#2a3a22';ctx.lineWidth=360;
  ctx.beginPath();ctx.moveTo(600-camera.x,600-camera.y);ctx.lineTo(3000-camera.x,3000-camera.y);ctx.stroke();
  const rG=ctx.createLinearGradient(600-camera.x,600-camera.y,3000-camera.x,3000-camera.y);
  rG.addColorStop(0,'#0a2a50');rG.addColorStop(.25,'#1a4a80');rG.addColorStop(.5,'#2a6aa8');rG.addColorStop(.75,'#1a4a80');rG.addColorStop(1,'#0a2a50');
  ctx.strokeStyle=rG;ctx.lineWidth=330;
  ctx.beginPath();ctx.moveTo(600-camera.x,600-camera.y);ctx.lineTo(3000-camera.x,3000-camera.y);ctx.stroke();
  const t=performance.now()*.001;
  ctx.strokeStyle='rgba(200,240,255,.5)';ctx.lineWidth=3;
  for(let i=0;i<24;i++){
    const tt=(i/24+(t*.1)%1)%1;
    const bx=600+2400*tt-camera.x,by=600+2400*tt-camera.y;
    if(bx<-200||by<-200||bx>W+200||by>H+200)continue;
    const off=Math.sin(t*2+i)*35;
    const w=50+Math.sin(t+i*.5)*20;
    ctx.beginPath();ctx.moveTo(bx-w+off,by-20);ctx.quadraticCurveTo(bx+off,by-45,bx+w+off,by-20);ctx.stroke();
  }
  ctx.restore();
  for(const c of camps){
    if(!isCampValid(c))continue;
    const sx=c.x-camera.x,sy=c.y-camera.y;
    if(sx<-c.r-60||sy<-c.r-60||sx>W+c.r+60||sy>H+c.r+60)continue;
    const cg=ctx.createRadialGradient(sx,sy,0,sx,sy,c.r);
    if(c.kind==='big'){cg.addColorStop(0,'rgba(90,55,25,.6)');cg.addColorStop(1,'rgba(60,35,15,0)')}
    else{cg.addColorStop(0,'rgba(75,75,35,.5)');cg.addColorStop(1,'rgba(50,60,25,0)')}
    ctx.fillStyle=cg;ctx.beginPath();ctx.ellipse(sx,sy,c.r*1.1,c.r*.75,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=c.kind==='big'?'rgba(210,140,70,.7)':'rgba(190,190,100,.6)';
    ctx.setLineDash([12,10]);ctx.lineWidth=2.5;
    ctx.beginPath();ctx.ellipse(sx,sy,c.r*1.1,c.r*.75,0,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);
  }
  // Область Терзателя
  for(const tp of terrorSpots){
    const sx=tp.x-camera.x,sy=tp.y-camera.y;
    if(sx<-tp.r-100||sy<-tp.r-100||sx>W+tp.r+100||sy>H+tp.r+100)continue;
    // Красная аура опасности
    const tg=ctx.createRadialGradient(sx,sy,0,sx,sy,tp.r*1.5);
    tg.addColorStop(0,'rgba(120,0,0,.4)');
    tg.addColorStop(.5,'rgba(80,0,0,.2)');
    tg.addColorStop(1,'rgba(50,0,0,0)');
    ctx.fillStyle=tg;ctx.beginPath();ctx.ellipse(sx,sy,tp.r*1.5,tp.r*1.1,0,0,Math.PI*2);ctx.fill();
    // Пульсирующий контур
    const pulse=.5+Math.sin(t*2)*.3;
    ctx.strokeStyle='rgba(255,60,60,'+(.4+pulse*.3)+')';
    ctx.setLineDash([8,8]);ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(sx,sy,tp.r,tp.r*.75,0,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);
    // Черепа-предупреждения
    ctx.font='bold 24px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='rgba(255,80,80,.4)';
    ctx.fillText('☠',sx-tp.r*.7,sy);
    ctx.fillText('☠',sx+tp.r*.7,sy);
  }
  for(const d of decorations){if(d.type==='grass'||d.type==='flower')drawDeco3D(d,camera)}
  for(const d of decorations){if(d.type==='rock'||d.type==='mushroom'||d.type==='bones')drawDeco3D(d,camera)}
  for(const t of trees)drawTree3D(t,camera);
}

function renderState(state,myId){
  const me=state.players.find(p=>p.id===myId);if(!me)return;
  const myTeam=me.team;
  const camera={x:Math.max(0,Math.min(WORLD.w-W,me.x-W/2)),y:Math.max(0,Math.min(WORLD.h-H,me.y-H/2))};
  drawGround3D(camera,state.trees,state.decorations||[]);
  for(const d of (state.decorations||[]))if(d.type==='log'||d.type==='ruin')drawDeco3D(d,camera);
  for(const d of (state.decorations||[]))if(d.type==='bush'||d.type==='glowCrystal')drawDeco3D(d,camera);
  drawBase3D(state.bases.blue,camera,myTeam);
  drawBase3D(state.bases.red,camera,myTeam);
  const all=[];
  for(const u of state.units)if(u.hp>0)all.push({obj:u,isPlayer:false});
  for(const p of state.players)if(!p.dead)all.push({obj:p,isPlayer:true});
  all.sort((a,b)=>a.obj.y-b.obj.y);
  for(const it of all){
    const u=it.obj;
    const sx=u.x-camera.x,sy=u.y-camera.y;
    if(sx<-120||sy<-120||sx>W+120||sy>H+120)continue;
    if(u.type==='tower'){drawTower3D(u,camera,myTeam);continue}
    let style,isMe=false;
    if(it.isPlayer){
      isMe=u.id===myId;
      if(u.team==='blue')style={body:'#1a6ac8',bodyLight:'#5ab0ff',bodyDark:'#0a2a5a',head:'#f0c090',headLight:'#ffe8c8',headDark:'#8a6a48',weapon:'staff',crystalColor:'#6cf',helmet:'#2a7ac8',helmetLight:'#8ac8ff',plume:'#ffd84a',cape:'#1a4a9a',capeLight:'#3a7ac8',capeDark:'#0a2a5a',isHero:true,isMe,team:'blue'};
      else style={body:'#8a1a1a',bodyLight:'#d04a4a',bodyDark:'#3a0505',head:'#c0a090',headLight:'#e8c8a8',headDark:'#6a4a3a',weapon:'axe',helmet:'#5a0a0a',helmetLight:'#9a2a2a',horns:true,cape:'#5a0a0a',capeLight:'#8a2a2a',capeDark:'#2a0505',isHero:true,isMe:false,team:'red'};
    } else if(u.type==='terror'){
      // ТЕРЗАТЕЛЬ - демонический вид
      style={body:'#3a0505',bodyLight:'#7a1010',bodyDark:'#1a0000',head:'#4a0808',headLight:'#8a1818',headDark:'#2a0000',weapon:'scythe',helmet:'#2a0404',helmetLight:'#5a0808',horns:true,emblem:'#ff2020',team:'neutral',isHero:true,isMe:false};
    } else if(u.type==='neutral'){
      style=u.big?{body:'#5a2a10',bodyLight:'#a05a20',bodyDark:'#2a0a04',head:'#6a3a18',headLight:'#9a5a28',headDark:'#3a1a08',weapon:'club',team:'neutral'}:{body:'#3a5a18',bodyLight:'#7aaa3a',bodyDark:'#0a1a05',head:'#4a6a20',headLight:'#7aaa3a',headDark:'#1a2a08',weapon:'claw',team:'neutral'};
    } else {
      style=u.team==='blue'?{body:'#3a6aa8',bodyLight:'#6a9ae8',bodyDark:'#0a2a5a',head:'#f0c090',headLight:'#ffe8c8',headDark:'#8a6a48',weapon:'staff',crystalColor:'#8cf',helmet:'#4a7ac8',helmetLight:'#8ac8ff',team:'blue'}:{body:'#a83a3a',bodyLight:'#e05a5a',bodyDark:'#4a0505',head:'#f0c090',headLight:'#ffe8c8',headDark:'#8a6a48',weapon:'axe',helmet:'#c85a5a',helmetLight:'#e88a8a',team:'red'};
    }
    drawChar3D(sx,sy,u,style,myTeam);
    drawHpBar3D(u,sx,sy,isMe,myTeam);
  }
  if(state.couriers)for(const c of state.couriers){
    const sx=c.x-camera.x,sy=c.y-camera.y;
    if(sx<-120||sy<-120||sx>W+120||sy>H+120)continue;
    const r=16;
    drawShadow(sx,sy+r*.9,r*1.15,r*.42,.45);
    ctx.save();ctx.translate(sx,sy);
    const sw=Math.sin(performance.now()*.02)*3;
    ctx.strokeStyle='#4a2a0a';ctx.lineWidth=3;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-r*.3,r*.3);ctx.lineTo(-r*.3+sw,r*.85);ctx.stroke();
    ctx.beginPath();ctx.moveTo(r*.3,r*.3);ctx.lineTo(r*.3-sw,r*.85);ctx.stroke();
    ctx.fillStyle='#8a5a2a';ctx.fillRect(-r*.7,-r*.5,r*1.4,r*.8);
    ctx.strokeStyle='#3a1a08';ctx.lineWidth=2;ctx.strokeRect(-r*.7,-r*.5,r*1.4,r*.8);
    ctx.fillStyle='#a06a3a';ctx.beginPath();ctx.moveTo(-r*.7,-r*.5);ctx.quadraticCurveTo(0,-r*1.2,r*.7,-r*.5);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fd0';ctx.beginPath();ctx.arc(0,-r*.2,r*.15,0,Math.PI*2);ctx.fill();
    ctx.shadowColor='#fd0';ctx.shadowBlur=12;ctx.strokeStyle='#fd0';ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(0,0,r*1.35,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;
    ctx.restore();
  }
  for(const b of state.bullets){
    const sx=b.x-camera.x,sy=b.y-camera.y;
    const g=ctx.createRadialGradient(sx,sy,0,sx,sy,24);
    g.addColorStop(0,b.color);g.addColorStop(.4,b.color);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,sy,24,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=25;
    ctx.beginPath();ctx.arc(sx,sy,7,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.shadowBlur=15;ctx.beginPath();ctx.arc(sx,sy,3,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  }
  if(state.shardDrops)for(const d of state.shardDrops){
    const sx=d.x-camera.x,sy=d.y-camera.y;
    const pulse=1+Math.sin(performance.now()*.02)*.3;
    ctx.shadowColor='#fd0';ctx.shadowBlur=18;ctx.fillStyle='#fd0';
    ctx.beginPath();ctx.moveTo(sx,sy-9*pulse);ctx.lineTo(sx+6*pulse,sy);ctx.lineTo(sx,sy+9*pulse);ctx.lineTo(sx-6*pulse,sy);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1.8;ctx.stroke();ctx.shadowBlur=0;
  }
  if(state.floatTexts)for(const f of state.floatTexts){
    const sx=f.x-camera.x,sy=f.y-camera.y;
    ctx.globalAlpha=Math.max(0,f.t/f.maxT);
    ctx.fillStyle=f.color;ctx.font='bold 16px Arial';ctx.textAlign='center';
    ctx.strokeStyle='#000';ctx.lineWidth=4;ctx.strokeText(f.text,sx,sy);
    ctx.fillText(f.text,sx,sy);ctx.globalAlpha=1;
  }
  for(const e of state.effects){
    const sx=e.x-camera.x,sy=e.y-camera.y;
    const a=Math.max(0,e.t/e.maxT);
    ctx.globalAlpha=a;
    ctx.strokeStyle=e.color;ctx.lineWidth=6;ctx.shadowColor=e.color;ctx.shadowBlur=30;
    ctx.beginPath();ctx.ellipse(sx,sy,e.r,e.r*.65,0,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.shadowBlur=15;
    ctx.beginPath();ctx.ellipse(sx,sy,e.r*.7,e.r*.46,0,0,Math.PI*2);ctx.stroke();
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
}

function drawMinimap(state,myId){
  const S=120,sc=S/WORLD.w;
  mmCtx.fillStyle='#0a150a';mmCtx.fillRect(0,0,S,S);
  mmCtx.strokeStyle='#2a4a7a';mmCtx.lineWidth=320*sc;mmCtx.lineCap='round';
  mmCtx.beginPath();mmCtx.moveTo(600*sc,600*sc);mmCtx.lineTo(3000*sc,3000*sc);mmCtx.stroke();
  mmCtx.strokeStyle='rgba(190,165,110,.5)';mmCtx.lineWidth=90*sc;
  for(const lane of LANES){
    mmCtx.beginPath();mmCtx.moveTo(lane[0].x*sc,lane[0].y*sc);
    for(let i=1;i<lane.length;i++)mmCtx.lineTo(lane[i].x*sc,lane[i].y*sc);
    mmCtx.stroke();
  }
  for(const c of camps){
    if(!isCampValid(c))continue;
    mmCtx.fillStyle=c.kind==='big'?'#c88040':'#8aa040';
    mmCtx.beginPath();mmCtx.arc(c.x*sc,c.y*sc,2,0,Math.PI*2);mmCtx.fill();
  }
  for(const t of terrorSpots){
    const alive=state.units.some(u=>u.type==='terror'&&u.hp>0&&Math.hypot(u.x-t.x,u.y-t.y)<t.r+60);
    mmCtx.fillStyle=alive?'#ff2020':'#552020';
    mmCtx.beginPath();mmCtx.arc(t.x*sc,t.y*sc,5,0,Math.PI*2);mmCtx.fill();
    mmCtx.strokeStyle='#fff';mmCtx.lineWidth=1;
    mmCtx.beginPath();mmCtx.arc(t.x*sc,t.y*sc,5,0,Math.PI*2);mmCtx.stroke();
  }
  for(const b of [state.bases.blue,state.bases.red]){
    mmCtx.fillStyle=b.team==='blue'?'#4af':'#f44';
    mmCtx.beginPath();mmCtx.arc(b.x*sc,b.y*sc,5,0,Math.PI*2);mmCtx.fill();
  }
  for(const u of state.units){
    if(u.hp<=0)continue;
    const sx=u.x*sc,sy=u.y*sc;
    if(u.type==='tower')mmCtx.fillStyle=u.team==='blue'?'#6af':'#f66';
    else if(u.type==='terror')mmCtx.fillStyle='#ff2020';
    else if(u.type==='neutral')mmCtx.fillStyle='#fd8';
    else mmCtx.fillStyle=u.team==='blue'?'#8cf':'#f88';
    mmCtx.fillRect(sx-1,sy-1,u.type==='terror'?4:2.5,u.type==='terror'?4:2.5);
  }
  for(const p of state.players){
    if(p.dead)continue;
    mmCtx.fillStyle=p.id===myId?'#0f0':'#f0f';
    mmCtx.beginPath();mmCtx.arc(p.x*sc,p.y*sc,3.5,0,Math.PI*2);mmCtx.fill();
    if(p.id===myId){mmCtx.strokeStyle='#fff';mmCtx.lineWidth=1.5;mmCtx.beginPath();mmCtx.arc(p.x*sc,p.y*sc,3.5,0,Math.PI*2);mmCtx.stroke()}
  }
}

function updateUI(state,myId){
  const me=state.players.find(p=>p.id===myId);if(!me)return;
  document.getElementById('hpBar').style.width=(me.hp/me.hpMax*100)+'%';
  document.getElementById('mpBar').style.width=(me.mp/me.mpMax*100)+'%';
  document.getElementById('hpTxt').textContent=Math.ceil(me.hp)+'/'+me.hpMax;
  document.getElementById('mpTxt').textContent=Math.ceil(me.mp)+'/'+me.mpMax;
  document.getElementById('lvlTxt').textContent=me.level;
  document.getElementById('killsTxt').textContent=me.kills;
  document.getElementById('shardsTxt').textContent=me.shards||0;
  const base=me.team==='blue'?state.bases.blue:state.bases.red;
  document.getElementById('baseTxt').textContent=Math.max(0,Math.ceil(base.hp));
  for(const k of ['Q','W','E','R']){
    const el=document.getElementById('btn'+k),a=me.abil[k];
    const cdEl=el.querySelector('.cd'),lvlEl=el.querySelector('.lvl');
    if(!a.unlocked){el.classList.add('locked');lvlEl.textContent='ур.'+ABIL_UNLOCK[k]}
    else{el.classList.remove('locked');lvlEl.textContent='ур.'+a.level}
    if(a.cd>0){cdEl.style.display='flex';cdEl.textContent=Math.ceil(a.cd)}
    else cdEl.style.display='none';
  }
  const respEl=document.getElementById('respawn');
  if(me.dead){respEl.style.display='flex';respEl.textContent='💀 ВЫ МЕРТВЫ\nРеспавн: '+Math.ceil(me.respawnTimer)+'с';respEl.style.whiteSpace='pre'}
  else respEl.style.display='none';
}

function showMsg(text,color,duration){
  const m=document.getElementById('msg');
  m.textContent=text;m.style.color=color||'#fff';m.style.display='block';
  clearTimeout(m._t);
  if(duration)m._t=setTimeout(()=>m.style.display='none',duration);
}

let lastFrame=performance.now();
let errorShown=false;
function mainLoop(now){
  try{
    const dt=Math.min(.05,(now-lastFrame)/1000);
    lastFrame=now;
    if(isHost&&host.gameState){
      sendInput();hostTick(dt);
      host.broadcastTimer-=dt;
      if(host.broadcastTimer<=0){hostBroadcastState();host.broadcastTimer=1/30}
      if(document.getElementById('shopModal').style.display==='block'&&Math.random()<.05)renderShop();
      const state={players:Object.values(host.gameState.players).map(p=>({id:p.id,team:p.team,x:p.x,y:p.y,r:p.r,dir:p.dir,walking:p.walking,hp:p.hp,hpMax:p.hpMax,mp:p.mp,mpMax:p.mpMax,level:p.level,kills:p.kills,dead:p.dead,shards:p.shards||0,inventory:p.inventory||[],respawnTimer:p.respawnTimer,abil:p.abil,attackAnim:p.attackAnim,hurtFlash:p.hurtFlash,castAnim:p.castAnim})),units:host.gameState.units,bullets:host.gameState.bullets,effects:host.gameState.effects,shardDrops:host.gameState.shardDrops,floatTexts:host.gameState.floatTexts,couriers:host.gameState.couriers,bases:host.gameState.bases,trees:host.gameState.trees,decorations:host.gameState.decorations};
      renderState(state,myId);updateUI(state,myId);drawMinimap(state,myId);
    } else if(!isHost&&remoteState){
      sendInput();renderState(remoteState,myId);updateUI(remoteState,myId);drawMinimap(remoteState,myId);
      if(document.getElementById('shopModal').style.display==='block'&&Math.random()<.05)renderShop();
    }
  } catch(e){
    console.error('Game error:',e);
    if(!errorShown){errorShown=true;showMsg('Ошибка: '+e.message,'#f44',5000)}
  }
  requestAnimationFrame(mainLoop);
}
</script>
